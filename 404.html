<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Simplicity</title>
  <script>
    (function () {
      var saved = localStorage.getItem('simplicity-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    .error-dots {
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
    }

    .error-dots circle {
      fill: var(--fg);
      opacity: 0.85;
    }

    .error-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--fg);
    }

    .error-message {
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--fg-muted);
      margin-top: 0.75rem;
      max-width: 30ch;
      line-height: 1.55;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 2.25rem;
    }
  </style>
</head>
<body>
  <div class="error-wrap">
    <svg class="error-dots" viewBox="0 0 40 40">
      <circle cx="20" cy="6"  r="3.2"/>
      <circle cx="12" cy="12" r="2.8"/>
      <circle cx="28" cy="12" r="2.8"/>
      <circle cx="7"  cy="20" r="2.4"/>
      <circle cx="33" cy="20" r="2.4"/>
      <circle cx="20" cy="20" r="2.2"/>
      <circle cx="20" cy="28" r="2"/>
      <circle cx="20" cy="34" r="1.8"/>
    </svg>
    <p class="error-code">404</p>
    <p class="error-message">This page doesn't exist. Let's get you back to something that does.</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/">Back to homepage</a>
      <a class="btn btn-outline" href="mailto:cofelixsmos@gmail.com">Contact us</a>
    </div>
  </div>
  <div data-footer></div>
  <script src="/scripts/nav-init.js"></script>
</body>
</html>
