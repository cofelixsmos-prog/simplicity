<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Simplicity</title>
<meta name="description" content="Log in to Simplicity.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      try {
        if (sessionStorage.getItem('simplicity-consent') === 'rejected') return;
      } catch (error) {
        // Continue with the cookie check if session storage is unavailable.
      }
      if (consent === 'rejected') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..900&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 440;
  }

  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
  }

  .auth-mark {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .auth-mark svg {
    width: 32px;
    height: 32px;
  }

  .auth-mark circle {
    fill: var(--fg);
  }

  .auth-card h1 {
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.015em;
    text-align: center;
  }

  .auth-card .auth-sub {
    color: var(--fg-muted);
    font-size: 0.95rem;
    text-align: center;
    margin-top: 8px;
  }

  .auth-form {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .auth-field label {
    font-size: 0.85rem;
    font-weight: 550;
    color: var(--fg-muted);
  }

  .auth-field input {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .auth-field input:focus {
    border-color: var(--accent);
  }

  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
  }

  .auth-row a {
    color: var(--fg-muted);
    text-decoration: none;
  }

  .auth-row a:hover {
    color: var(--fg);
  }

  .auth-submit {
    margin-top: 6px;
    width: 100%;
    justify-content: center;
  }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0;
    color: var(--fg-muted);
    font-size: 0.8rem;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--nav-border);
  }

  .auth-alt {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 11px 20px;
    border-radius: 24px;
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 550;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .auth-alt:hover {
    background: var(--btn-outline-hover);
  }

  .auth-alt svg {
    width: 16px;
    height: 16px;
  }

  .auth-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--fg-muted);
  }

  .auth-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 550;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }

  .auth-home {
    display: none;
  }

  .auth-home svg {
    width: 26px;
    height: 26px;
  }

  .auth-home circle {
    fill: var(--fg);
  }

  @media (min-width: 861px) {
    .auth-wrap {
      height: calc(100dvh - 98px);
      min-height: 0;
      padding: clamp(12px, 3vh, 48px) 24px;
      overflow: hidden;
    }

    .auth-mark {
      margin-bottom: clamp(10px, 2vh, 28px);
    }

    .auth-form {
      margin-top: clamp(14px, 2.5vh, 32px);
      gap: clamp(8px, 1.5vh, 16px);
    }

    .auth-divider {
      margin: clamp(12px, 2vh, 26px) 0;
    }

    .auth-footer {
      margin-top: clamp(12px, 2vh, 28px);
    }
  }
</style>
</head>
<body>
  <a class="auth-home" href="/" aria-label="Simplicity home">
    <svg viewBox="0 0 40 40">
      <circle cx="20" cy="6"  r="3.2"/>
      <circle cx="12" cy="12" r="2.8"/>
      <circle cx="28" cy="12" r="2.8"/>
      <circle cx="7"  cy="20" r="2.4"/>
      <circle cx="33" cy="20" r="2.4"/>
      <circle cx="20" cy="20" r="2.2"/>
      <circle cx="20" cy="28" r="2"/>
      <circle cx="20" cy="34" r="1.8"/>
    </svg>
  </a>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mark">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="6"  r="3.2"/>
          <circle cx="12" cy="12" r="2.8"/>
          <circle cx="28" cy="12" r="2.8"/>
          <circle cx="7"  cy="20" r="2.4"/>
          <circle cx="33" cy="20" r="2.4"/>
          <circle cx="20" cy="20" r="2.2"/>
          <circle cx="20" cy="28" r="2"/>
          <circle cx="20" cy="34" r="1.8"/>
        </svg>
      </div>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to keep working with Simplicity.</p>

      <form class="auth-form" onsubmit="return false;">
        <div class="auth-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <div class="auth-row">
          <span></span>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
          <svg class="btn-dot" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="2.4" fill="#fff"/>
            <circle cx="7" cy="1.4" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="12.6" cy="7" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="7" cy="12.6" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="1.4" cy="7" r="1.5" fill="#fff" opacity="0.75"/>
          </svg>
          Log in
        </button>
      </form>

      <div class="auth-divider">or</div>

      <button type="button" class="auth-alt">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48 0-.24-.01-1.02-.01-1.85-2.78.51-3.5-.68-3.72-1.3-.13-.32-.68-1.3-1.16-1.57-.4-.21-.97-.74-.01-.76.9-.01 1.55.83 1.76 1.17 1.03 1.73 2.68 1.24 3.33.95.1-.75.4-1.24.73-1.53-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.28.1-2.66 0 0 .84-.27 2.75 1.02a9.4 9.4 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.41.1 2.66.64.7 1.03 1.58 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.75 0 .27.18.58.69.48A10 10 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
        Continue with GitHub
      </button>

      <p class="auth-footer">Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </div>
  <script src="/scripts/nav-init.js"></script>
</body>
</html>
