<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Simplicity</title>
<meta name="description" content="Log in to Simplicity.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
  
  }

  .auth-mark {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .auth-mark svg {
    width: 32px;
    height: 32px;
  }

  .auth-mark circle {
    fill: var(--fg);
  }

  .auth-card h1 {
    font-size: 1.75rem;
    font-weight: 650;
    letter-spacing: -0.015em;
    text-align: center;
  }

  .auth-card .auth-sub {
    color: var(--fg-muted);
    font-size: 0.95rem;
    text-align: center;
    margin-top: 8px;
  }

  .auth-form {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .auth-field label {
    font-size: 0.85rem;
    font-weight: 550;
    color: var(--fg-muted);
  }

  .auth-field input {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .auth-field input:focus {
    border-color: var(--accent);
  }

  .auth-submit {
    margin-top: 6px;
    width: 100%;
    justify-content: center;
  }

  .auth-error {
    margin-top: 18px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255, 90, 31, 0.1);
    color: var(--accent);
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .auth-error[hidden] {
    display: none;
  }

  .auth-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--fg-muted);
  }

  .auth-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 550;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }

  .auth-home {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
  }

  @media (max-width: 860px) {
    .auth-wrap {
      min-height: 100dvh;
      padding: 24px 20px 32px;
    }

    .auth-mark {
      margin-bottom: 16px;
    }

    .auth-form {
      margin-top: 20px;
      gap: 12px;
    }

    .auth-field label,
    .auth-field input {
      text-align: center;
    }

    .auth-footer {
      margin-top: 16px;
    }
  }

  @media (min-width: 861px) {
    .auth-wrap {
      height: 100dvh;
      min-height: 0;
      padding: clamp(12px, 3vh, 48px) 24px;
      overflow: hidden;
    }

    .auth-mark {
      margin-bottom: clamp(10px, 2vh, 28px);
    }

    .auth-form {
      margin-top: clamp(14px, 2.5vh, 32px);
      gap: clamp(8px, 1.5vh, 16px);
    }

    .auth-footer {
      margin-top: clamp(12px, 2vh, 28px);
    }
  }
</style>
</head>
<body data-no-nav>
  <div class="auth-home" data-brand-mark></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mark">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="6"  r="3.2"/>
          <circle cx="12" cy="12" r="2.8"/>
          <circle cx="28" cy="12" r="2.8"/>
          <circle cx="7"  cy="20" r="2.4"/>
          <circle cx="33" cy="20" r="2.4"/>
          <circle cx="20" cy="20" r="2.2"/>
          <circle cx="20" cy="28" r="2"/>
          <circle cx="20" cy="34" r="1.8"/>
        </svg>
      </div>

      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to keep working with Simplicity.</p>

      <p class="auth-error" id="auth-error" hidden></p>

      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="yourusername" autocomplete="username" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
          <svg class="btn-dot" viewBox="0 0 14 14">
            <circle cx="7" cy="7" r="2.4" fill="#fff"/>
            <circle cx="7" cy="1.4" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="12.6" cy="7" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="7" cy="12.6" r="1.5" fill="#fff" opacity="0.75"/>
            <circle cx="1.4" cy="7" r="1.5" fill="#fff" opacity="0.75"/>
          </svg>
          Log in
        </button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </div>
  <script src="/scripts/nav-init.js"></script>
  <script src="/scripts/auth-forms.js"></script>
</body>
</html>
