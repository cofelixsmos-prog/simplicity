<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Simplicity</title>
<meta name="description" content="Manage your Simplicity account and preferences.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    min-height: 100dvh;
  }

  .settings-app {
    display: flex;
    min-height: 100dvh;
  }

  .settings-sidebar {
    flex-shrink: 0;
    width: 240px;
    padding: 24px 16px;
    border-right: 1px solid var(--nav-border);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .settings-sidebar-brand {
    padding: 0 8px;
  }

  .settings-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .settings-nav-label {
    padding: 6px 12px 4px;
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  .settings-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg-muted);
    text-decoration: none;
    border: 1px solid transparent;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .settings-nav-item:hover {
    color: var(--fg);
    background: var(--btn-outline-hover);
  }

  .settings-nav-item.is-active {
    color: var(--fg);
    background: rgba(255, 90, 31, 0.08);
    border-color: rgba(255, 90, 31, 0.35);
  }

  .settings-nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .settings-sidebar-foot {
    margin-top: auto;
  }

  .settings-back {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--fg-muted);
    text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .settings-back:hover {
    color: var(--fg);
    background: var(--btn-outline-hover);
  }

  .settings-back svg {
    width: 14px;
    height: 14px;
  }

  .settings-main {
    flex: 1;
    min-width: 0;
    padding: 48px clamp(20px, 4vw, 64px) 80px;
  }

  .settings-main-inner {
    max-width: 640px;
    margin: 0 auto;
  }

  .settings-section {
    margin-bottom: 48px;
  }

  .settings-section-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .settings-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 18px 0;
    border-top: 1px solid var(--nav-border);
  }

  .settings-section .settings-field:first-of-type {
    border-top: none;
  }

  .settings-field-label {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--fg);
  }

  .settings-field-sub {
    margin-top: 3px;
    font-size: 13px;
    color: var(--fg-muted);
  }

  .settings-field-control {
    flex-shrink: 0;
  }

  .settings-input {
    width: 220px;
    max-width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .settings-input:focus {
    border-color: var(--accent);
  }

  .settings-input[readonly] {
    color: var(--fg-muted);
    cursor: default;
  }

  .settings-avatar-lg {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 19px;
    font-weight: 650;
    border: 2px solid var(--accent);
  }

  .settings-danger {
    border: 1px solid rgba(255, 90, 31, 0.35);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  @media (max-width: 780px) {
    .settings-app {
      flex-direction: column;
    }

    .settings-sidebar {
      width: 100%;
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--nav-border);
      padding: 14px 16px;
      gap: 16px;
    }

    .settings-nav {
      flex-direction: row;
    }

    .settings-nav-label { display: none; }
    .settings-sidebar-foot { margin-top: 0; margin-left: auto; }
    .settings-main { padding: 32px 20px 60px; }
  }
</style>
</head>
<body data-no-nav>
  <div class="settings-app">
    <aside class="settings-sidebar">
      <div class="settings-sidebar-brand" data-brand-mark></div>

      <nav class="settings-nav" aria-label="Settings">
        <p class="settings-nav-label">Settings</p>
        <a class="settings-nav-item is-active" href="#profile">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.5-4 5-5.5 7.5-5.5s6 1.5 7.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Profile
        </a>
        <a class="settings-nav-item" href="#preferences">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V20a2.05 2.05 0 1 1-4.1 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H4a2.05 2.05 0 1 1 0-4.1h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1.03-1.55V4a2.05 2.05 0 1 1 4.1 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.55 1.03H20a2.05 2.05 0 1 1 0 4.1h-.09a1.7 1.7 0 0 0-1.51 1.02Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Preferences
        </a>
        <a class="settings-nav-item" href="#account">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 9.5h18" stroke="currentColor" stroke-width="1.6"/></svg>
          Account
        </a>
      </nav>

      <div class="settings-sidebar-foot">
        <a class="settings-back" href="/chat.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to chat
        </a>
      </div>
    </aside>

    <main class="settings-main">
      <div class="settings-main-inner">
        <section class="settings-section" id="profile">
          <h2 class="settings-section-title">Profile</h2>

          <div class="settings-field">
            <div>
              <div class="settings-field-label">Avatar</div>
              <div class="settings-field-sub">Generated from your username.</div>
            </div>
            <div class="settings-field-control">
              <span class="settings-avatar-lg" id="settings-avatar">—</span>
            </div>
          </div>

          <div class="settings-field">
            <div>
              <div class="settings-field-label">Username</div>
              <div class="settings-field-sub">This is how you sign in.</div>
            </div>
            <div class="settings-field-control">
              <input class="settings-input" id="settings-username" type="text" readonly value="—">
            </div>
          </div>
        </section>

        <section class="settings-section" id="preferences">
          <h2 class="settings-section-title">Preferences</h2>

          <div class="settings-field">
            <div>
              <div class="settings-field-label">Theme</div>
              <div class="settings-field-sub">Switch between light and dark.</div>
            </div>
            <div class="settings-field-control">
              <button class="theme-toggle" id="settings-theme-toggle" aria-label="Toggle theme">
                <span class="theme-toggle-dot dot-light"></span>
                <span class="theme-toggle-dot dot-dark"></span>
                <span class="theme-toggle-thumb"></span>
              </button>
            </div>
          </div>
        </section>

        <section class="settings-section" id="account">
          <h2 class="settings-section-title">Account</h2>

          <div class="settings-danger">
            <div>
              <div class="settings-field-label">Log out</div>
              <div class="settings-field-sub">You'll need to sign in again to access your account.</div>
            </div>
            <button class="btn btn-outline" id="settings-logout" type="button">Log out</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/scripts/nav-init.js"></script>
  <script src="/scripts/settings-page.js"></script>
</body>
</html>
