<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness — Simplicity</title>
<meta name="description" content="Harness: give it a problem, it does the work.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..900&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body {
    font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 440;
  }

  /* ---------- Transparent nav over video hero, glass on hover ---------- */
  nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: transparent;
    border-bottom: 1px solid transparent;
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: background 0.35s ease, border-color 0.35s ease, backdrop-filter 0.35s ease, -webkit-backdrop-filter 0.35s ease;
  }

  nav:hover {
    background: rgba(10,9,7,0.35);
    border-bottom-color: rgba(243,241,236,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  nav a.brand-mark .brand-mark-dot circle { fill: #F3F1EC !important; }
  nav a.brand-mark .brand-mark-word { color: #F3F1EC !important; }
  nav .nav-dropdown-trigger { color: rgba(243,241,236,0.75); }
  nav .nav-dropdown:hover .nav-dropdown-trigger { color: #F3F1EC; }
  nav .theme-toggle { border-color: rgba(243,241,236,0.3); }
  nav .theme-toggle:hover { background: rgba(243,241,236,0.08); }
  nav .theme-toggle-dot { background: rgba(243,241,236,0.6); }
  nav .theme-toggle-thumb { background: #F3F1EC; }
  nav .mobile-menu-toggle { border-color: rgba(243,241,236,0.3); }
  nav .mobile-menu-toggle span { background: #F3F1EC; }
  nav .settings-btn { border-color: rgba(243,241,236,0.3); }
  nav .settings-btn:hover { background: rgba(243,241,236,0.08); }
  nav .settings-btn circle,
  nav .settings-btn path { stroke: #F3F1EC; }
  nav .btn-outline { border-color: rgba(243,241,236,0.3); color: #F3F1EC; }
  nav .btn-outline:hover { background: rgba(243,241,236,0.08); }

  nav .nav-dropdown-panel {
    background: transparent;
    border-top: 1px solid rgba(243,241,236,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 28px 52px;
  }

  nav .dropdown-links a { color: #F3F1EC; }

  nav .settings-panel {
    background: rgba(20,18,15,0.9);
    border-color: rgba(243,241,236,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  nav .settings-row { color: #F3F1EC; }
  nav .settings-row.is-button:hover { background: rgba(243,241,236,0.08); }
  nav .dropdown-col-label { color: rgba(243,241,236,0.55); }

  /* ---------- Harness intro loader ---------- */
  .harness-loader {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A0A;
    opacity: 1;
    transition: opacity 0.6s ease;
  }

  .harness-loader.is-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .harness-loader-grid {
    width: clamp(72px, 12vw, 110px);
    height: auto;
  }

  .harness-loader-grid circle {
    fill: #F3F1EC;
  }

  .harness-loader-dot {
    transition: r 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ---------- Harness hero + scroll-driven zoom-out reveal ---------- */
  .harness-hero {
    position: relative;
    height: 340vh;
    background: #0A0A0A;
  }

  .harness-hero-stage {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
  }

  .harness-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1);
    transition: opacity 1.6s ease;
    will-change: transform;
  }

  .harness-video.is-visible {
    opacity: 1;
  }

  .harness-hero-scrim {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
    transition: background 0.4s ease;
  }

  .harness-hero-text {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(16px, 3vw, 40px);
    will-change: opacity;
  }

  .harness-word {
    font-family: inherit;
    font-size: clamp(2.2rem, 4.6vw, 3.75rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #F3F1EC;
    line-height: 1;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }

  .harness-word.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .harness-word.word-right {
    transition-delay: 0.15s;
  }

  .harness-reveal-copy {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    opacity: 0;
    pointer-events: none;
    will-change: opacity, transform;
  }

  .harness-reveal-copy-inner {
    max-width: 620px;
  }

  .harness-reveal-copy h2 {
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #F3F1EC;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .harness-reveal-copy p {
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    line-height: 1.65;
    color: rgba(243,241,236,0.75);
  }

  @media (max-width: 640px) {
    .harness-hero-stage { min-height: 460px; }
    .harness-word { font-size: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .harness-video, .harness-word, .harness-loader { transition: none; }
    .harness-hero { height: auto; }
    .harness-hero-stage { position: relative; height: 100vh; }
    .harness-hero-text { display: none; }
    .harness-reveal-copy { position: relative; opacity: 1; pointer-events: auto; padding: 80px 24px; }
  }
</style>
</head>
<body>
  <div class="harness-loader" id="harness-loader">
    <svg class="harness-loader-grid" id="harness-loader-grid" viewBox="0 0 80 112"></svg>
  </div>

  <section class="harness-hero" id="harness-hero">
    <div class="harness-hero-stage">
      <video class="harness-video" id="harness-video" src="/videos/singularity.mp4" autoplay muted loop playsinline></video>
      <div class="harness-hero-scrim" id="harness-hero-scrim"></div>
      <div class="harness-hero-text" id="harness-hero-text">
        <span class="harness-word word-left" id="harness-word-left">Simplicity</span>
        <span class="harness-word word-right" id="harness-word-right">Harness</span>
      </div>
      <div class="harness-reveal-copy" id="harness-reveal-copy">
        <div class="harness-reveal-copy-inner">
          <h2>So what is Harness?</h2>
          <p>It's the thing that actually does the work. You describe the task, Harness plans it, uses the tools it needs, and hands you a finished result — not a draft, not a to-do list. No setup, no babysitting.</p>
        </div>
      </div>
    </div>
  </section>

  <div data-footer></div>

  <script src="/scripts/harness-loader.js"></script>
  <script src="/scripts/harness-reveal.js"></script>
  <script src="/scripts/nav-init.js"></script>
</body>
</html>
