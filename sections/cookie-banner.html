      <p class="cookie-banner-text">We use essential cookies to run the site. Optional cookies remember preferences like your theme. <a href="#" id="cookie-banner-settings">Manage choices</a>.</p>

        <button class="btn btn-outline" id="cookie-reject" type="button">Reject</button>
        <button class="btn btn-primary" id="cookie-accept" type="button">Accept</button>
      </div>
    </div>
  </div>
  <button class="cookie-reopen" id="cookie-reopen" type="button" aria-label="Open cookie settings">Cookies</button>
