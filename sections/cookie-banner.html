  <div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie notice">
    <div class="cookie-banner-inner">
      <button class="cookie-banner-close" id="cookie-banner-close" type="button" aria-label="Reject optional cookies and minimize cookie notice" title="Close banner">&times;</button>
      <p class="cookie-banner-text">We use cookies to remember preferences like your theme. <a href="#" id="cookie-banner-settings">Settings</a>.</p>
      <div class="cookie-banner-actions">
        <button class="btn btn-outline" id="cookie-reject" type="button" title="Reject optional cookies">Reject</button>
        <button class="btn btn-primary" id="cookie-accept" type="button" title="Accept optional cookies">Accept</button>
      </div>
    </div>
  </div>
  <button class="cookie-reopen" id="cookie-reopen" type="button" aria-label="Open cookie settings" title="Cookie choices">Cookies</button>
