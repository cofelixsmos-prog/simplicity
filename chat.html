<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Simplicity</title>
<meta name="description" content="Chat with Simplicity.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* ---------- Chat-specific navigation controls ---------- */
  nav {
    min-height: 0;
  }
  nav .nav-dot {
    width: 16px;
    height: 16px;
  }
  nav .nav-wordmark {
    font-size: 13px;
  }
  nav .nav-links {
    gap: 20px;
  }
  nav .nav-links a,
  nav .nav-dropdown-trigger {
    font-size: 13px;
  }
  nav .nav-dropdown-panel {
    padding: 20px 24px;
  }
  nav .dropdown-links.large a {
    font-size: 20px;
  }
  nav .btn {
    padding: 8px 16px;
    font-size: 13px;
  }
  nav .settings-btn {
    width: 30px;
    height: 30px;
  }
  nav .theme-toggle {
    width: 46px;
    height: 24px;
  }
  nav .theme-toggle-thumb {
    width: 16px;
    height: 16px;
  }
  html[data-theme="dark"] nav .theme-toggle-thumb {
    transform: translateX(22px);
  }

  /* ---------- Brand application (from brand.html) ----------
     Brand colors: Accent #FF5A1F, Hover #F04E15, Light #F3F1EC,
     Dark #0A0A0A, Muted #6B6A63. Poppins + dot-mark language. */
  ::selection {
    background: var(--accent);
    color: #fff;
  }

  /* ---------- Very simple chat layout ---------- */
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none;
  }

  body {
    height: 100dvh;
    overflow: hidden;
  }

  .chat-shell {
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  .chat-main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-wrap {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px calc(16px + clamp(60px, 18vh, 140px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .chat-wrap::-webkit-scrollbar {
    display: none;
  }

  .chat-wrap.has-messages {
    justify-content: flex-end;
    padding-bottom: 16px;
  }

  .chat-messages {
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: center;
  }

  .chat-wrap.has-messages .chat-messages {
    flex: 1;
    justify-content: flex-start;
  }

  .chat-empty {
    text-align: center;
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  .chat-empty.is-leaving {
    opacity: 0;
    transform: translateY(-10px) scale(0.97);
  }

  @keyframes chat-form-settle {
    from {
      transform: translateY(-18px);
    }
    to {
      transform: translateY(0);
    }
  }

  .chat-form.is-settling {
    animation: chat-form-settle 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes chat-bubble-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg-user,
  .bot-row {
    animation: chat-bubble-in 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .chat-mark {
    display: inline-flex;
    margin-bottom: 16px;
    opacity: 0.92;
  }

  .chat-mark svg {
    width: 34px;
    height: 34px;
  }

  .chat-mark circle {
    fill: var(--fg);
  }

  .chat-empty strong {
    display: block;
    color: var(--fg);
    font-size: clamp(1.3rem, 2.8vw, 1.85rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .chat-bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .chat-bubble.user {
    background: transparent;
    color: var(--fg);
    border: 1.5px dashed rgba(255, 90, 31, 0.55);
  }

  .chat-bubble.bot {
    background: transparent;
    color: var(--fg);
    border: none;
    padding: 2px 0;
    max-width: 100%;
  }

  .msg-user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    max-width: 75%;
  }

  .bot-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    align-self: flex-start;
    max-width: 100%;
    width: 100%;
  }

  .bot-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .bot-logo {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 2px;
  }

  .bot-logo circle {
    fill: var(--fg);
  }

  .msg-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 6px;
    font-size: 11.5px;
    line-height: 1;
    color: var(--fg-muted);
    opacity: 0.7;
  }

  .msg-user .msg-meta {
    justify-content: flex-end;
  }

  .meta-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: inherit;
    color: inherit;
    cursor: pointer;
  }

  .meta-btn:hover {
    color: var(--fg);
    opacity: 1;
    text-decoration: underline;
  }

  .followup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 2px 0 0 32px;
    align-self: flex-start;
  }

  .followup-chip {
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .followup-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tool-trace {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 2px 0 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--fg-muted);
  }

  .tool-trace[hidden] {
    display: none;
  }

  .tool-step {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0.35;
  }

  .tool-step.is-active .tool-dot {
    opacity: 0.7;
  }

  .tool-step.is-done .tool-dot {
    opacity: 1;
  }

  .tool-step.is-done .tool-label::after {
    content: " ✓";
    color: var(--accent);
  }

  .chat-form {
    position: sticky;
    bottom: 12px;
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1.5px solid var(--btn-outline-border);
    border-radius: 22px;
    padding: 7px 7px 7px 16px;
    background: var(--bg);
    box-shadow: 0 1px 0 var(--nav-border);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .chat-form:focus-within {
    border-color: var(--accent);
  }

  .chat-form textarea {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    resize: none;
    overflow-y: auto;
    max-height: 140px;
    padding: 8px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .chat-form textarea::-webkit-scrollbar {
    display: none;
  }

  .chat-form textarea::placeholder {
    color: var(--fg-muted);
    user-select: none;
    -webkit-user-select: none;
  }

  .chat-send {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .chat-send:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .chat-send svg {
    width: 17px;
    height: 17px;
  }

  .chat-send circle {
    fill: #fff;
  }

  .queue-bar {
    position: sticky;
    bottom: 70px;
    z-index: 19;
    background: var(--bg);
    border: 1.5px solid #55534e;
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .queue-bar[hidden] {
    display: none;
  }

  .queue-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    cursor: pointer;
  }

  .queue-caret {
    transition: transform 0.15s ease;
  }

  .queue-bar.is-collapsed .queue-caret {
    transform: rotate(-90deg);
  }

  .queue-bar.is-collapsed .queue-list,
  .queue-bar.is-collapsed .queue-actions {
    display: none;
  }

  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .queue-list::-webkit-scrollbar {
    display: none;
  }

  .queue-item {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--fg-muted);
    border-top: 1px solid var(--btn-outline-border);
    padding-top: 6px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .queue-item:first-child {
    border-top: none;
    padding-top: 0;
  }

  .queue-actions {
    display: flex;
    gap: 8px;
  }

  .queue-actions button {
    flex: 1;
    border-radius: 999px;
    padding: 7px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--btn-outline-border);
  }

  .queue-actions button:hover {
    border-color: #55534e;
    color: #55534e;
  }

  /* ---------- History sidebar ---------- */
  .chat-sidebar {
    flex-shrink: 0;
    width: 264px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 12px;
    border-right: 1px solid var(--nav-border);
    background: var(--bg);
    overflow: hidden;
    transition: margin-left 0.25s ease;
  }

  .chat-sidebar.is-collapsed {
    margin-left: -264px;
  }

  .chat-sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 8px;
  }

  .chat-brand-mount {
    display: flex;
    align-items: center;
  }

  .sidebar-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .sidebar-toggle:hover {
    background: var(--btn-outline-hover);
    color: var(--fg);
  }

  .sidebar-toggle svg {
    width: 16px;
    height: 16px;
  }

  .sidebar-toggle-mobile {
    display: none;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13.5px;
    font-weight: 550;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .new-chat-btn:hover {
    border-color: var(--accent);
    background: var(--btn-outline-hover);
  }

  .new-chat-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .history-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 8px;
    padding-right: 2px;
  }

  .history-list::-webkit-scrollbar {
    width: 6px;
  }

  .history-list::-webkit-scrollbar-thumb {
    background: var(--btn-outline-border);
    border-radius: 999px;
  }

  .history-empty {
    padding: 10px 10px;
    font-size: 12.5px;
    color: var(--fg-muted);
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 9px;
    border: none;
    background: none;
    color: var(--fg-muted);
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
  }

  .history-item-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-item:hover {
    background: var(--btn-outline-hover);
    color: var(--fg);
  }

  .history-item.is-active {
    background: rgba(255, 90, 31, 0.1);
    color: var(--fg);
  }

  .history-item-delete {
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
  }

  .history-item:hover .history-item-delete {
    display: inline-flex;
  }

  .history-item-delete:hover {
    background: rgba(255, 90, 31, 0.15);
    color: var(--accent);
  }

  .history-item-delete svg {
    width: 12px;
    height: 12px;
  }

  .chat-sidebar-foot {
    padding-top: 8px;
    border-top: 1px solid var(--nav-border);
  }

  .sidebar-account-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px;
    border-radius: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .sidebar-account-btn:hover {
    background: var(--btn-outline-hover);
  }

  .sidebar-account-name {
    font-size: 13.5px;
    font-weight: 550;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .account-panel-up {
    top: auto;
    bottom: calc(100% + 8px);
  }

  /* ---------- Chat top bar ---------- */
  .chat-top {
    flex-shrink: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--nav-border);
    user-select: none;
    -webkit-user-select: none;
  }

  .chat-top-title {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 550;
    color: var(--fg-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-clear {
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg-muted);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .chat-clear:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .scroll-bottom {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 88px;
    z-index: 30;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--btn-outline-border);
    background: var(--bg);
    color: var(--fg);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scroll-bottom:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .scroll-bottom[hidden] {
    display: none;
  }

  @media (max-width: 860px) {
    .chat-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 100;
      width: min(280px, 82vw);
      box-shadow: 0 0 0 100vw rgba(0,0,0,0);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      margin-left: 0;
    }

    .chat-sidebar.is-open {
      transform: translateX(0);
      box-shadow: 0 0 0 100vw rgba(0,0,0,0.35);
    }

    .sidebar-toggle:not(.sidebar-toggle-mobile) {
      display: none;
    }

    .sidebar-toggle-mobile {
      display: inline-flex;
    }
  }

  /* ---------- Settings dialog ---------- */
  .settings-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
  }

  .settings-modal-overlay.is-visible {
    opacity: 1;
    visibility: visible;
  }

  .settings-modal {
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--nav-border);
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    padding: 26px;
    transform: translateY(12px) scale(0.98);
    transition: transform 0.25s ease;
  }

  .settings-modal-overlay.is-visible .settings-modal {
    transform: translateY(0) scale(1);
  }

  .settings-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .settings-modal-head h2 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .settings-modal-close {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .settings-modal-close:hover {
    background: var(--btn-outline-hover);
    color: var(--fg);
  }

  .settings-modal-close svg {
    width: 13px;
    height: 13px;
  }

  .settings-identity {
    margin-top: 20px;
    padding: 18px;
    border-radius: 16px;
    background: var(--btn-outline-hover);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .settings-identity-avatar {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--fg);
  }

  .settings-identity-avatar svg {
    width: 22px;
    height: 22px;
  }

  .settings-identity-avatar svg circle {
    fill: var(--bg);
  }

  .settings-identity-text {
    min-width: 0;
  }

  .settings-identity-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .settings-identity-label {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--fg-muted);
  }

  .settings-modal-row {
    padding: 18px 0;
    border-top: 1px solid var(--nav-border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .settings-modal-row-text h3 {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .settings-modal-row-text p {
    color: var(--fg-muted);
    font-size: 0.85rem;
    line-height: 1.5;
    max-width: 38ch;
  }

  .settings-modal-actions {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  @media (max-width: 480px) {
    .settings-modal { padding: 20px; }
  }

</style>
</head>
<body data-no-nav data-require-auth>
  <div class="chat-shell">
    <aside class="chat-sidebar" id="chat-sidebar">
      <div class="chat-sidebar-head">
        <div class="chat-brand-mount" data-brand-mark></div>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 5v14M9 5v14M4 5h16v14H4V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        New chat
      </button>

      <div class="history-list" id="history-list">
        <p class="history-empty" id="history-empty">No conversations yet.</p>
      </div>

      <div class="chat-sidebar-foot">
        <div class="account-dropdown" id="account-dropdown">
          <button class="sidebar-account-btn" id="account-toggle" aria-label="Account" aria-expanded="false" aria-controls="account-panel">
            <span class="account-btn" id="account-avatar">?</span>
            <span class="sidebar-account-name" id="sidebar-account-name">Account</span>
          </button>
          <div class="account-panel account-panel-up" id="account-panel">
            <div class="account-panel-head">
              <p class="account-panel-name" id="account-panel-username">—</p>
            </div>
            <button class="account-row is-button" id="settings-open" type="button">Settings</button>
            <button class="account-row is-button" id="account-logout" type="button">Log out</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="chat-main">
      <header class="chat-top">
        <button class="sidebar-toggle sidebar-toggle-mobile" id="sidebar-toggle-mobile" type="button" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="chat-top-title" id="chat-top-title">New chat</span>
        <button class="chat-clear" id="chat-clear" type="button">Clear chat</button>
      </header>
      <main class="chat-wrap">
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <span class="chat-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="6"  r="3.2"/>
            <circle cx="12" cy="12" r="2.8"/>
            <circle cx="28" cy="12" r="2.8"/>
            <circle cx="7"  cy="20" r="2.4"/>
            <circle cx="33" cy="20" r="2.4"/>
            <circle cx="20" cy="20" r="2.2"/>
            <circle cx="20" cy="28" r="2"/>
            <circle cx="20" cy="34" r="1.8"/>
          </svg>
        </span>
        <strong>What can I help with?</strong>
        Ask anything to get started.
      </div>
    </div>

    <div class="queue-bar" id="queue-bar" hidden>
      <button class="queue-head" id="queue-toggle" type="button" aria-expanded="true" aria-controls="queue-list">
        <span>Queued (<span id="queue-count">0</span>) — waiting for reply</span>
        <span class="queue-caret" aria-hidden="true">▾</span>
      </button>
      <div class="queue-list" id="queue-list"></div>
      <div class="queue-actions">
        <button type="button" id="queue-edit">Edit</button>
        <button type="button" id="queue-forget">Forget</button>
      </div>
    </div>

    <form class="chat-form" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Message Simplicity…" autocomplete="off" aria-label="Message"></textarea>
      <button type="submit" class="chat-send" aria-label="Send">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="6"  r="3.2"/>
          <circle cx="12" cy="12" r="2.8"/>
          <circle cx="28" cy="12" r="2.8"/>
          <circle cx="7"  cy="20" r="2.4"/>
          <circle cx="33" cy="20" r="2.4"/>
          <circle cx="20" cy="20" r="2.2"/>
          <circle cx="20" cy="28" r="2"/>
          <circle cx="20" cy="34" r="1.8"/>
        </svg>
      </button>
    </form>
    <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="Scroll to bottom" hidden>↓</button>
      </main>
    </div>
  </div>

  <script src="/scripts/nav-init.js"></script>
  <script>
    (function () {
      var form = document.getElementById('chat-form');
      var input = document.getElementById('chat-input');
      var messages = document.getElementById('chat-messages');
      var empty = document.getElementById('chat-empty');
      var chatWrap = document.querySelector('.chat-wrap');
      var queueBar = document.getElementById('queue-bar');
      var queueList = document.getElementById('queue-list');
      var queueCount = document.getElementById('queue-count');
      var queueToggle = document.getElementById('queue-toggle');
      var queueEdit = document.getElementById('queue-edit');
      var queueForget = document.getElementById('queue-forget');

      var sidebar = document.getElementById('chat-sidebar');
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var sidebarToggleMobile = document.getElementById('sidebar-toggle-mobile');
      var historyList = document.getElementById('history-list');
      var historyEmpty = document.getElementById('history-empty');

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          sidebar.classList.toggle('is-collapsed');
        });
      }

      function closeMobileSidebar() {
        sidebar.classList.remove('is-open');
      }

      if (sidebarToggleMobile) {
        sidebarToggleMobile.addEventListener('click', function () {
          sidebar.classList.toggle('is-open');
        });
      }

      document.addEventListener('click', function (event) {
        if (!sidebar.classList.contains('is-open')) return;
        if (sidebar.contains(event.target) || (sidebarToggleMobile && sidebarToggleMobile.contains(event.target))) return;
        closeMobileSidebar();
      });

      function setActiveHistoryItem(conversationId) {
        historyList.querySelectorAll('.history-item').forEach(function (item) {
          item.classList.toggle('is-active', item.getAttribute('data-id') === conversationId);
        });
      }

      function buildHistoryItem(conversation) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'history-item';
        item.setAttribute('data-id', conversation.id);

        var title = document.createElement('span');
        title.className = 'history-item-title';
        title.textContent = conversation.title;
        item.appendChild(title);

        var del = document.createElement('span');
        del.className = 'history-item-delete';
        del.setAttribute('role', 'button');
        del.setAttribute('aria-label', 'Delete conversation');
        del.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
        del.addEventListener('click', function (event) {
          event.stopPropagation();
          deleteConversation(conversation.id);
        });
        item.appendChild(del);

        item.addEventListener('click', function () {
          openConversation(conversation.id);
        });

        return item;
      }

      function loadHistoryList(activeId) {
        fetch('/api/chat/conversations')
          .then(function (response) { return response.ok ? response.json() : { conversations: [] }; })
          .then(function (data) {
            var list = data.conversations || [];
            historyList.innerHTML = '';
            if (!list.length) {
              historyList.appendChild(historyEmpty);
              return;
            }
            list.forEach(function (conversation) {
              historyList.appendChild(buildHistoryItem(conversation));
            });
            if (activeId) setActiveHistoryItem(activeId);
          })
          .catch(function (error) { console.error(error); });
      }

      function deleteConversation(conversationId) {
        fetch('/api/chat/conversations/' + conversationId, { method: 'DELETE' })
          .then(function () {
            if (conversationId === currentConversationId) startNewChat();
            loadHistoryList(currentConversationId);
          })
          .catch(function (error) { console.error(error); });
      }

      function renderStoredMessage(msg) {
        if (msg.role === 'user') {
          addBubble(msg.content, 'user');
          return;
        }
        if (msg.role !== 'assistant') return;

        enterChatMode();
        var row = document.createElement('div');
        row.className = 'bot-row';
        var logo = document.createElement('span');
        logo.className = 'bot-logo';
        logo.setAttribute('aria-hidden', 'true');
        logo.innerHTML = BOT_LOGO_SVG;
        var content = document.createElement('div');
        content.className = 'bot-content';

        if (msg.toolCalls && msg.toolCalls.length) {
          var trace = document.createElement('div');
          trace.className = 'tool-trace';
          msg.toolCalls.forEach(function (call) {
            var step = document.createElement('div');
            step.className = 'tool-step is-done';
            var label = TOOL_LABELS[call.name] || call.name;
            if (call.name === 'get_time' && call.result && call.result.time) {
              label = 'get_time → ' + call.result.time;
            }
            step.innerHTML = '<span class="tool-dot"></span><span class="tool-label">' + label + '</span>';
            trace.appendChild(step);
          });
          content.appendChild(trace);
        }

        var div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.textContent = msg.content;
        content.appendChild(div);
        content.appendChild(makeMeta(msg.content, formatTime(new Date(msg.createdAt)), false, null));
        row.appendChild(logo);
        row.appendChild(content);
        messages.appendChild(row);
      }

      function openConversation(conversationId) {
        viewGeneration++;
        var requestGeneration = viewGeneration;

        fetch('/api/chat/conversations/' + conversationId)
          .then(function (response) {
            if (!response.ok) throw new Error('not_found');
            return response.json();
          })
          .then(function (data) {
            if (requestGeneration !== viewGeneration) return;
            currentConversationId = data.id;
            if (chatTopTitle) chatTopTitle.textContent = data.title;
            resetChatView();
            data.messages.forEach(renderStoredMessage);
            if (data.messages.length) {
              chatWrap.classList.add('has-messages');
              hasEnteredChatMode = true;
              refreshRetry();
            }
            setActiveHistoryItem(conversationId);
            closeMobileSidebar();
            chatWrap.scrollTop = chatWrap.scrollHeight;
            setLastConversationCookie(conversationId);
          })
          .catch(function (error) {
            if (error && error.message === 'not_found') clearLastConversationCookie();
            console.error(error);
          });
      }

      var hasEnteredChatMode = false;

      function enterChatMode() {
        if (empty && !empty.classList.contains('is-leaving')) {
          empty.classList.add('is-leaving');
          setTimeout(function () {
            if (empty && empty.parentNode) empty.remove();
          }, 280);
        }
        if (!hasEnteredChatMode) {
          hasEnteredChatMode = true;
          chatWrap.classList.add('has-messages');
          form.classList.add('is-settling');
          form.addEventListener('animationend', function handler() {
            form.classList.remove('is-settling');
            form.removeEventListener('animationend', handler);
          });
        }
      }

      var isResponding = false;
      var queue = [];

      function renderQueue() {
        queueCount.textContent = String(queue.length);
        queueBar.hidden = queue.length === 0;
        while (queueList.firstChild) queueList.removeChild(queueList.firstChild);
        queue.forEach(function (text) {
          var item = document.createElement('div');
          item.className = 'queue-item';
          item.textContent = text;
          queueList.appendChild(item);
        });
        positionScrollBtn();
      }

      function enqueueMessage(text) {
        queue.push(text);
        renderQueue();
      }

      function onBotDone() {
        isResponding = false;
        if (queue.length) {
          var next = queue.shift();
          renderQueue();
          handleUserMessage(next);
        } else {
          if (followOutput) scrollPageBottom(false);
          updateScrollBtn();
        }
      }

      queueToggle.addEventListener('click', function () {
        var collapsed = queueBar.classList.toggle('is-collapsed');
        queueToggle.setAttribute('aria-expanded', String(!collapsed));
        positionScrollBtn();
      });

      queueEdit.addEventListener('click', function () {
        if (!queue.length) return;
        input.value = queue.join('\n');
        queue = [];
        renderQueue();
        autosizeInput();
        input.focus();
      });

      queueForget.addEventListener('click', function () {
        queue = [];
        renderQueue();
      });

      function autosizeInput() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autosizeInput);

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      var emptyInner = empty ? empty.innerHTML : '';
      var clearBtn = document.getElementById('chat-clear');
      var newChatBtn = document.getElementById('new-chat-btn');
      var chatTopTitle = document.getElementById('chat-top-title');
      var currentConversationId = null;
      var viewGeneration = 0;

      function resetChatView() {
        messages.innerHTML = '';
        var d = document.createElement('div');
        d.className = 'chat-empty';
        d.id = 'chat-empty';
        d.innerHTML = emptyInner;
        messages.appendChild(d);
        empty = d;
        chatWrap.classList.remove('has-messages');
        hasEnteredChatMode = false;
        hideFollowup();
        queue = [];
        renderQueue();
        input.value = '';
        autosizeInput();
        input.focus();
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }
        chatWrap.scrollTop = 0;
        updateScrollBtn();
      }

      function startNewChat() {
        viewGeneration++;
        currentConversationId = null;
        if (chatTopTitle) chatTopTitle.textContent = 'New chat';
        resetChatView();
        setActiveHistoryItem(null);
        closeMobileSidebar();
        clearLastConversationCookie();
      }

      clearBtn.addEventListener('click', startNewChat);
      if (newChatBtn) newChatBtn.addEventListener('click', startNewChat);

      autosizeInput();

      var scrollBtn = document.getElementById('scroll-bottom');
      var followOutput = false;
      var followTimer = null;
      var lastY = chatWrap.scrollTop;
      var lastMove = Date.now();

      function distFromBottom() {
        return chatWrap.scrollHeight - (chatWrap.scrollTop + chatWrap.clientHeight);
      }

      function isAtBottom() {
        return distFromBottom() < 120;
      }

      function scrollPageBottom(smooth) {
        chatWrap.scrollTo({ top: chatWrap.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }

      function updateScrollBtn() {
        scrollBtn.hidden = isAtBottom();
      }

      function positionScrollBtn() {
        if (queueBar.hidden) {
          scrollBtn.style.bottom = '';
        } else {
          scrollBtn.style.bottom = (70 + queueBar.offsetHeight + 12) + 'px';
        }
      }

      function ensureFollowLoop() {
        if (followTimer) return;
        lastY = chatWrap.scrollTop;
        lastMove = Date.now();
        followTimer = setInterval(function () {
          if (!isResponding || !followOutput) {
            clearInterval(followTimer);
            followTimer = null;
            return;
          }
          var y = chatWrap.scrollTop;
          if (y !== lastY) {
            lastY = y;
            lastMove = Date.now();
          }
          if (Date.now() - lastMove > 1000) {
            clearInterval(followTimer);
            followTimer = null;
            return;
          }
          scrollPageBottom(false);
        }, 100);
      }

      function noteUserScroll() {
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }
        updateScrollBtn();
      }

      chatWrap.addEventListener('scroll', function () {
        updateScrollBtn();
      }, { passive: true });
      window.addEventListener('resize', function () {
        positionScrollBtn();
      });
      chatWrap.addEventListener('wheel', noteUserScroll, { passive: true });
      chatWrap.addEventListener('touchmove', noteUserScroll, { passive: true });
      chatWrap.addEventListener('keydown', function (e) {
        if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].indexOf(e.key) !== -1) noteUserScroll();
      });

      scrollBtn.addEventListener('click', function () {
        followOutput = true;
        scrollPageBottom(true);
        updateScrollBtn();
        if (isResponding) ensureFollowLoop();
      });

      updateScrollBtn();

      var BOT_LOGO_SVG = '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="6" r="3.2"/><circle cx="12" cy="12" r="2.8"/><circle cx="28" cy="12" r="2.8"/><circle cx="7" cy="20" r="2.4"/><circle cx="33" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.2"/><circle cx="20" cy="28" r="2"/><circle cx="20" cy="34" r="1.8"/></svg>';

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function copyText(text, btn) {
        function done() {
          var original = btn.getAttribute('data-label') || 'Copy';
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = original; }, 1200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      }

      function typewriteText(el, fullText, done) {
        var i = 0;
        el.textContent = '';
        var timer = setInterval(function () {
          i++;
          el.textContent = fullText.slice(0, i);
          chatWrap.scrollTop = chatWrap.scrollHeight;
          if (isResponding && followOutput) {
            scrollPageBottom(false);
            ensureFollowLoop();
          }
          if (i >= fullText.length) {
            clearInterval(timer);
            if (done) done();
          }
        }, 55);
      }

      var followupRow = document.createElement('div');
      followupRow.className = 'followup-row';
      var followupBtn = document.createElement('button');
      followupBtn.type = 'button';
      followupBtn.className = 'followup-chip';
      followupBtn.textContent = 'What is the time?';
      followupBtn.setAttribute('aria-label', 'Ask what is the time');
      followupBtn.addEventListener('click', function () {
        handleUserMessage('What is the time?');
      });
      followupRow.appendChild(followupBtn);

      function hideFollowup() {
        if (followupRow.parentNode) followupRow.parentNode.removeChild(followupRow);
      }

      function showFollowup() {
        hideFollowup();
        var rows = messages.querySelectorAll('.bot-row');
        if (!rows.length) return;
        var last = rows[rows.length - 1];
        last.parentNode.insertBefore(followupRow, last.nextSibling);
        chatWrap.scrollTop = chatWrap.scrollHeight;
      }

      function makeMeta(text, time, showRetry, onRetry) {
        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        var timeEl = document.createElement('span');
        timeEl.className = 'msg-time';
        timeEl.textContent = time;
        meta.appendChild(timeEl);
        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'meta-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.setAttribute('data-label', 'Copy');
        copyBtn.setAttribute('aria-label', 'Copy message');
        copyBtn.addEventListener('click', function () { copyText(text, copyBtn); });
        meta.appendChild(copyBtn);
        if (showRetry) {
          var retryBtn = document.createElement('button');
          retryBtn.type = 'button';
          retryBtn.className = 'meta-btn meta-retry';
          retryBtn.textContent = 'Retry';
          retryBtn.setAttribute('aria-label', 'Retry response');
          retryBtn.addEventListener('click', onRetry);
          meta.appendChild(retryBtn);
        }
        return meta;
      }

      function refreshRetry() {
        var rows = messages.querySelectorAll('.bot-row');
        rows.forEach(function (row, i) {
          var old = row.querySelector('.meta-retry');
          if (old) old.remove();
          if (i === rows.length - 1) {
            var meta = row.querySelector('.msg-meta');
            var bubble = row.querySelector('.chat-bubble.bot');
            if (meta && bubble) {
              var retryBtn = document.createElement('button');
              retryBtn.type = 'button';
              retryBtn.className = 'meta-btn meta-retry';
              retryBtn.textContent = 'Retry';
              retryBtn.setAttribute('aria-label', 'Retry response');
              retryBtn.addEventListener('click', function () { retryResponse(row); });
              meta.appendChild(retryBtn);
            }
          }
        });
      }

      var TOOL_LABELS = {
        get_time: 'Checking the time'
      };

      function retryResponse(row) {
        var sourceMessage = row.getAttribute('data-source');
        if (!sourceMessage) return;
        row.remove();
        sendBotReply(sourceMessage);
      }

      function addBubble(text, who) {
        enterChatMode();
        var time = formatTime(new Date());
        var wrap = document.createElement('div');
        wrap.className = 'msg-user';
        var userDiv = document.createElement('div');
        userDiv.className = 'chat-bubble user';
        userDiv.textContent = text;
        wrap.appendChild(userDiv);
        wrap.appendChild(makeMeta(text, time, false, null));
        messages.appendChild(wrap);
        chatWrap.scrollTop = chatWrap.scrollHeight;
      }

      function requestFailedMessage(error) {
        if (error && error.message === 'rate_limited') {
          return "You're sending messages too quickly. Give it a moment and try again.";
        }
        if (error && error.message && error.message !== 'request_failed') {
          return error.message;
        }
        return "Something went wrong reaching Simplicity. Please try again.";
      }

      function sendBotReply(sourceMessage) {
        hideFollowup();
        var requestGeneration = viewGeneration;

        var row = document.createElement('div');
        row.className = 'bot-row';
        row.setAttribute('data-source', sourceMessage);
        var logo = document.createElement('span');
        logo.className = 'bot-logo';
        logo.setAttribute('aria-hidden', 'true');
        logo.innerHTML = BOT_LOGO_SVG;
        var content = document.createElement('div');
        content.className = 'bot-content';

        var trace = document.createElement('div');
        trace.className = 'tool-trace';
        trace.setAttribute('aria-live', 'polite');
        trace.hidden = true;
        content.appendChild(trace);

        var div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.textContent = '…';
        content.appendChild(div);
        row.appendChild(logo);
        row.appendChild(content);
        messages.appendChild(row);
        chatWrap.scrollTop = chatWrap.scrollHeight;

        fetch('/api/chat/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: sourceMessage, conversationId: currentConversationId }),
        })
          .then(function (response) {
            if (response.status === 429) return Promise.reject(new Error('rate_limited'));
            if (!response.ok) return response.json().then(function (data) {
              var err = new Error(data.error || 'request_failed');
              err.conversationId = data.conversationId || null;
              return Promise.reject(err);
            });
            return response.json();
          })
          .then(function (data) {
            if (requestGeneration !== viewGeneration) return;
            if (data.conversationId && data.conversationId !== currentConversationId) {
              currentConversationId = data.conversationId;
              if (chatTopTitle) chatTopTitle.textContent = sourceMessage.length > 48 ? sourceMessage.slice(0, 47) + '…' : sourceMessage;
              loadHistoryList(currentConversationId);
              setLastConversationCookie(currentConversationId);
            }
            var toolCalls = data.toolCalls || [];
            if (toolCalls.length) {
              trace.hidden = false;
              toolCalls.forEach(function (call) {
                var step = document.createElement('div');
                step.className = 'tool-step is-done';
                var label = TOOL_LABELS[call.name] || call.name;
                if (call.name === 'get_time' && call.result && call.result.time) {
                  label = 'get_time → ' + call.result.time;
                }
                step.innerHTML = '<span class="tool-dot"></span><span class="tool-label">' + label + '</span>';
                trace.appendChild(step);
              });
              chatWrap.scrollTop = chatWrap.scrollHeight;
            }

            var answer = data.reply || "I don't have a response for that.";
            if (requestGeneration !== viewGeneration) {
              onBotDone();
              return;
            }
            typewriteText(div, answer, function () {
              content.appendChild(makeMeta(answer, formatTime(new Date()), false, null));
              refreshRetry();
              showFollowup();
              chatWrap.scrollTop = chatWrap.scrollHeight;
              onBotDone();
            });
          })
          .catch(function (error) {
            if (requestGeneration !== viewGeneration) {
              onBotDone();
              return;
            }
            if (error && error.conversationId && error.conversationId !== currentConversationId) {
              currentConversationId = error.conversationId;
              if (chatTopTitle) chatTopTitle.textContent = sourceMessage.length > 48 ? sourceMessage.slice(0, 47) + '…' : sourceMessage;
              loadHistoryList(currentConversationId);
              setLastConversationCookie(currentConversationId);
            }
            var message = requestFailedMessage(error);
            typewriteText(div, message, function () {
              content.appendChild(makeMeta(message, formatTime(new Date()), false, null));
              refreshRetry();
              chatWrap.scrollTop = chatWrap.scrollHeight;
              onBotDone();
            });
          });
      }

      function handleUserMessage(value) {
        if (isResponding) {
          enqueueMessage(value);
          input.value = '';
          autosizeInput();
          return;
        }
        isResponding = true;
        addBubble(value, 'user');
        input.value = '';
        autosizeInput();
        scrollPageBottom(false);
        updateScrollBtn();
        hideFollowup();
        sendBotReply(value);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) return;
        handleUserMessage(value);
      });

      var settingsOverlay = document.getElementById('settings-modal-overlay');
      var settingsOpenBtn = document.getElementById('settings-open');
      var settingsCloseBtn = document.getElementById('settings-modal-close');
      var settingsUsernameEl = document.getElementById('settings-username');
      var settingsThemeToggle = document.getElementById('modal-theme-toggle');
      var settingsLogoutBtn = document.getElementById('settings-logout');
      var accountDropdown = document.getElementById('account-dropdown');
      var accountToggleBtn = document.getElementById('account-toggle');
      var sidebarAccountName = document.getElementById('sidebar-account-name');

      function openSettings() {
        if (accountDropdown) accountDropdown.classList.remove('is-open');
        if (accountToggleBtn) accountToggleBtn.setAttribute('aria-expanded', 'false');
        if (settingsUsernameEl && sidebarAccountName) settingsUsernameEl.textContent = sidebarAccountName.textContent;
        settingsOverlay.classList.add('is-visible');
        if (settingsCloseBtn) settingsCloseBtn.focus();
      }

      function closeSettings() {
        settingsOverlay.classList.remove('is-visible');
      }

      if (settingsOpenBtn) settingsOpenBtn.addEventListener('click', openSettings);
      if (settingsCloseBtn) settingsCloseBtn.addEventListener('click', closeSettings);
      settingsOverlay.addEventListener('click', function (event) {
        if (event.target === settingsOverlay) closeSettings();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && settingsOverlay.classList.contains('is-visible')) closeSettings();
      });

      if (settingsThemeToggle) {
        settingsThemeToggle.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false');
        settingsThemeToggle.addEventListener('click', function () {
          var root = document.documentElement;
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          settingsThemeToggle.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
          if (window.simplicitySetThemeCookie) window.simplicitySetThemeCookie(next);
        });
      }

      if (settingsLogoutBtn) {
        settingsLogoutBtn.addEventListener('click', function () {
          fetch('/api/auth/logout', { method: 'POST' }).then(function () {
            window.location.href = '/login.html';
          });
        });
      }

      var LAST_CONVERSATION_COOKIE = 'simplicity-last-conversation';

      function setLastConversationCookie(conversationId) {
        var date = new Date();
        date.setTime(date.getTime() + 30 * 24 * 60 * 60 * 1000);
        document.cookie = LAST_CONVERSATION_COOKIE + '=' + encodeURIComponent(conversationId) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
      }

      function getLastConversationCookie() {
        var match = document.cookie.match(new RegExp('(?:^|; )' + LAST_CONVERSATION_COOKIE + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      function clearLastConversationCookie() {
        document.cookie = LAST_CONVERSATION_COOKIE + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax';
      }

      var lastConversationId = getLastConversationCookie();
      loadHistoryList(lastConversationId);
      if (lastConversationId) openConversation(lastConversationId);
    })();
  </script>

  <div class="settings-modal-overlay" id="settings-modal-overlay">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
      <div class="settings-modal-head">
        <h2 id="settings-modal-title">Settings</h2>
        <button class="settings-modal-close" id="settings-modal-close" type="button" aria-label="Close settings">
          <svg viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="settings-identity">
        <span class="settings-identity-avatar" id="settings-avatar">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="6"  r="3.2"/>
            <circle cx="12" cy="12" r="2.8"/>
            <circle cx="28" cy="12" r="2.8"/>
            <circle cx="7"  cy="20" r="2.4"/>
            <circle cx="33" cy="20" r="2.4"/>
            <circle cx="20" cy="20" r="2.2"/>
            <circle cx="20" cy="28" r="2"/>
            <circle cx="20" cy="34" r="1.8"/>
          </svg>
        </span>
        <div class="settings-identity-text">
          <p class="settings-identity-name" id="settings-username">—</p>
          <p class="settings-identity-label">Simplicity account</p>
        </div>
      </div>

      <div class="settings-modal-row">
        <div class="settings-modal-row-text">
          <h3>Theme</h3>
          <p>Switch between light and dark.</p>
        </div>
        <button class="theme-toggle" id="modal-theme-toggle" aria-label="Toggle theme">
          <span class="theme-toggle-dot dot-light"></span>
          <span class="theme-toggle-dot dot-dark"></span>
          <span class="theme-toggle-thumb"></span>
        </button>
      </div>

      <div class="settings-modal-actions">
        <button class="btn btn-outline" id="settings-logout" type="button">Log out</button>
      </div>
    </div>
  </div>
</body>
</html>
