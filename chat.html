<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Simplicity</title>
<meta name="description" content="Chat with Simplicity.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* ---------- Chat-specific navigation controls ---------- */
  nav {
    min-height: 0;
  }
  nav .nav-dot {
    width: 16px;
    height: 16px;
  }
  nav .nav-wordmark {
    font-size: 13px;
  }
  nav .nav-links {
    gap: 20px;
  }
  nav .nav-links a,
  nav .nav-dropdown-trigger {
    font-size: 13px;
  }
  nav .nav-dropdown-panel {
    padding: 20px 24px;
  }
  nav .dropdown-links.large a {
    font-size: 20px;
  }
  nav .btn {
    padding: 8px 16px;
    font-size: 13px;
  }
  nav .settings-btn {
    width: 30px;
    height: 30px;
  }
  nav .theme-toggle {
    width: 46px;
    height: 24px;
  }
  nav .theme-toggle-thumb {
    width: 16px;
    height: 16px;
  }
  html[data-theme="dark"] nav .theme-toggle-thumb {
    transform: translateX(22px);
  }

  /* ---------- Brand application (from brand.html) ----------
     Brand colors: Accent #FF5A1F, Hover #F04E15, Light #F3F1EC,
     Dark #0A0A0A, Muted #6B6A63. Poppins + dot-mark language. */
  ::selection {
    background: var(--accent);
    color: #fff;
  }

  /* ---------- Very simple chat layout ---------- */
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none;
  }

  body {
    height: 100dvh;
    overflow: hidden;
  }

  .chat-shell {
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  .chat-main {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px calc(16px + clamp(60px, 18vh, 140px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .chat-wrap::-webkit-scrollbar {
    display: none;
  }

  .chat-wrap.has-messages {
    justify-content: safe flex-end;
    padding-bottom: 16px;
  }

  .chat-messages {
    display: flex;
    flex-direction: column;
    gap: 28px;
    justify-content: center;
  }

  .chat-wrap.has-messages .chat-messages {
    justify-content: flex-start;
  }

  .chat-loading {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-bottom: 90px;
    background: var(--bg);
    color: var(--fg-muted);
    font-size: 14px;
  }

  .chat-loading[hidden] {
    display: none;
  }

  .chat-wrap.is-loading .chat-form,
  .chat-wrap.is-loading .queue-bar,
  .chat-wrap.is-loading .scroll-bottom {
    visibility: hidden;
  }

  .chat-loading strong {
    color: var(--fg);
    font-size: 18px;
    font-weight: 500;
  }

  .chat-empty {
    text-align: center;
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  .chat-empty.is-leaving {
    opacity: 0;
    transform: translateY(-10px) scale(0.97);
  }

  @keyframes chat-bubble-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg-user,
  .bot-row {
    animation: chat-bubble-in 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .chat-mark {
    display: inline-flex;
    margin-bottom: 16px;
    opacity: 0.92;
  }

  .chat-mark svg {
    width: 34px;
    height: 34px;
  }

  .chat-mark circle {
    fill: var(--fg);
  }

  .chat-empty strong {
    display: block;
    color: var(--fg);
    font-size: clamp(1.3rem, 2.8vw, 1.85rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .chat-bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .chat-bubble.user {
    background: transparent;
    color: var(--fg);
    border: 1.5px dashed rgba(255, 90, 31, 0.55);
  }

  .chat-bubble.bot {
    background: transparent;
    color: var(--fg);
    border: none;
    padding: 2px 0;
    max-width: 100%;
  }

  .chat-bubble.bot .md-h1,
  .chat-bubble.bot .md-h2,
  .chat-bubble.bot .md-h3 {
    margin: 14px 0 6px;
    font-weight: 650;
    line-height: 1.3;
  }

  .chat-bubble.bot .md-h1:first-child,
  .chat-bubble.bot .md-h2:first-child,
  .chat-bubble.bot .md-h3:first-child {
    margin-top: 0;
  }

  .chat-bubble.bot .md-h1 { font-size: 1.25em; }
  .chat-bubble.bot .md-h2 { font-size: 1.15em; }
  .chat-bubble.bot .md-h3 { font-size: 1.05em; }

  .chat-bubble.bot .md-list {
    margin: 6px 0;
    padding-left: 22px;
  }

  .chat-bubble.bot .md-list li {
    margin: 2px 0;
  }

  .chat-bubble.bot .md-table-wrap {
    margin: 10px 0;
    max-width: 100%;
    overflow-x: auto;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
  }

  .chat-bubble.bot .md-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92em;
  }

  .chat-bubble.bot .md-table th,
  .chat-bubble.bot .md-table td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--btn-outline-border);
    white-space: nowrap;
  }

  .chat-bubble.bot .md-table th {
    background: var(--btn-outline-hover);
    font-weight: 650;
    color: var(--fg);
  }

  .chat-bubble.bot .md-table tr:last-child td {
    border-bottom: none;
  }

  .chat-bubble.bot .md-table tbody tr:hover {
    background: var(--btn-outline-hover);
  }

  .chat-bubble.bot .md-inline-code {
    background: var(--btn-outline-hover);
    border: 1px solid var(--btn-outline-border);
    border-radius: 5px;
    padding: 1px 5px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 0.9em;
  }

  .chat-bubble.bot .md-code-block {
    margin: 8px 0;
    padding: 12px 14px;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
    background: var(--btn-outline-hover);
    overflow-x: auto;
  }

  .chat-bubble.bot .md-code-block code {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 0.88em;
    line-height: 1.5;
    white-space: pre;
  }

  .chat-bubble.bot a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(255, 90, 31, 0.4);
  }

  .chat-bubble.bot a:hover {
    text-decoration-color: var(--accent);
  }

  .chat-bubble.bot .md-hl {
    display: block;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    margin: 8px 0;
    font-weight: 550;
    line-height: 1.5;
  }

  .question-dock {
    flex-shrink: 0;
    display: none;
  }

  .question-dock.is-active {
    display: block;
    margin-bottom: 10px;
  }

  .question-card {
    width: 100%;
    border: 1px solid var(--nav-border);
    border-radius: 16px;
    background: var(--btn-outline-hover);
    padding: 16px;
    outline: none;
  }

  .question-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .question-text {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    line-height: 1.4;
  }

  .question-step {
    flex-shrink: 0;
    font-size: 11.5px;
    color: var(--fg-muted);
    opacity: 0.75;
    white-space: nowrap;
    margin-top: 2px;
    margin-right: 4px;
  }

  .question-close {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
  }

  .question-close:hover {
    background: var(--btn-outline-hover);
    color: var(--fg);
  }

  .question-close svg {
    width: 12px;
    height: 12px;
  }

  .question-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--btn-outline-border);
    border-radius: 12px;
    overflow: hidden;
  }

  .question-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-bottom: 1px solid var(--btn-outline-border);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
  }

  .question-row:last-child {
    border-bottom: none;
  }

  .question-row.is-selected {
    background: var(--btn-outline-hover);
  }

  .question-row-num {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: var(--btn-outline-hover);
    color: var(--fg-muted);
    font-size: 11px;
    font-weight: 600;
  }

  .question-row.is-selected .question-row-num {
    background: var(--accent);
    color: #fff;
  }

  .question-row-num svg {
    width: 11px;
    height: 11px;
  }

  .question-row-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .question-row-hint {
    flex-shrink: 0;
    display: inline-flex;
    opacity: 0;
    color: var(--fg-muted);
    transition: opacity 0.1s ease;
  }

  .question-row.is-selected .question-row-hint {
    opacity: 1;
  }

  .question-row-hint svg {
    width: 14px;
    height: 14px;
  }

  .question-row-custom {
    cursor: text;
  }

  .question-row-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13.5px;
  }

  .question-row-input::placeholder {
    color: var(--fg-muted);
  }

  .question-skip-btn {
    flex-shrink: 0;
    border: none;
    background: var(--btn-outline-hover);
    color: var(--fg-muted);
    border-radius: 999px;
    padding: 4px 10px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }

  .question-skip-btn:hover {
    color: var(--fg);
  }

  .question-foot {
    margin-top: 10px;
    font-size: 11px;
    color: var(--fg-muted);
    opacity: 0.7;
  }

  .question-foot kbd {
    font: inherit;
    background: var(--btn-outline-hover);
    border-radius: 4px;
    padding: 1px 5px;
  }

  .msg-user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    max-width: 75%;
  }

  .bot-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    align-self: flex-start;
    max-width: 100%;
    width: 100%;
  }

  .bot-content {
    flex: 1;
    min-width: 0;
    max-width: 78%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .bot-logo {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 2px;
  }

  .bot-logo circle {
    fill: var(--fg);
  }

  .msg-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 6px;
    font-size: 11.5px;
    line-height: 1;
    color: var(--fg-muted);
    opacity: 0.7;
  }

  .msg-user .msg-meta {
    justify-content: flex-end;
  }

  .meta-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: inherit;
    color: inherit;
    cursor: pointer;
  }

  .meta-btn:hover {
    color: var(--fg);
    opacity: 1;
    text-decoration: underline;
  }

  .followup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 2px 0 0 32px;
    align-self: flex-start;
  }

  .followup-chip {
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .followup-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tool-trace {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 2px 0 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--fg-muted);
  }

  .tool-trace[hidden] {
    display: none;
  }

  .tool-step {
    display: block;
    border: 1px solid var(--btn-outline-border);
    border-radius: 10px;
    background: var(--btn-outline-hover);
    overflow: hidden;
  }

  .tool-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    cursor: pointer;
    list-style: none;
  }

  .tool-summary::-webkit-details-marker {
    display: none;
  }

  .tool-summary-chevron {
    margin-left: auto;
    flex-shrink: 0;
    display: inline-flex;
    color: var(--fg-muted);
    transition: transform 0.15s ease;
  }

  .tool-summary-chevron svg {
    width: 13px;
    height: 13px;
  }

  .tool-step[open] .tool-summary-chevron {
    transform: rotate(180deg);
  }

  .tool-details {
    margin: 0;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--btn-outline-border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tool-details-section-label {
    font-size: 10.5px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--fg-muted);
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .tool-details-fields {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tool-details-field {
    display: flex;
    gap: 6px;
    font-size: 12px;
    line-height: 1.5;
  }

  .tool-details-field-key {
    flex-shrink: 0;
    color: var(--fg-muted);
  }

  .tool-details-field-value {
    color: var(--fg);
    overflow-wrap: anywhere;
  }

  .tool-details-prose {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--fg);
  }

  .tool-details-meta {
    font-size: 11px;
    color: var(--fg-muted);
  }

  .tool-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0.35;
  }

  .tool-step.is-active .tool-dot {
    opacity: 0.7;
  }

  .tool-step.is-done .tool-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    background: transparent;
    opacity: 1;
  }

  .tool-step.is-done .tool-dot::after {
    content: "✓";
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
  }

  .tool-step:not([open]) {
    border-color: transparent;
    background: transparent;
    overflow: visible;
  }

  .tool-step:not([open]) .tool-summary {
    padding: 2px 0;
    color: var(--fg-muted);
  }

  .tool-step:not([open]) .tool-summary-chevron {
    opacity: 0.7;
  }

  .thinking-indicator {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    color: var(--fg-muted);
  }

  .thinking-dots {
    letter-spacing: 0;
  }

  .chat-form {
    position: sticky;
    bottom: 0;
    z-index: 20;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 24px;
    border: 1.5px solid var(--btn-outline-border);
    border-radius: 22px;
    padding: 7px 7px 7px 8px;
    background: var(--bg);
    box-shadow: 0 1px 0 var(--nav-border);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .chat-form:focus-within {
    border-color: var(--accent);
  }

  .chat-form textarea {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    resize: none;
    overflow-y: auto;
    max-height: 140px;
    padding: 8px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .chat-form textarea::-webkit-scrollbar {
    display: none;
  }

  .chat-form textarea::placeholder {
    color: var(--fg-muted);
    user-select: none;
    -webkit-user-select: none;
  }

  .model-picker {
    position: relative;
    flex-shrink: 0;
  }

  .model-picker-trigger {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 32px;
    padding: 0 10px 0 12px;
    border: 1px solid var(--btn-outline-border);
    border-radius: 999px;
    background: var(--btn-outline-hover);
    color: var(--fg);
    font: inherit;
    font-size: 12.5px;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .model-picker-trigger:hover {
    border-color: var(--accent);
  }

  .model-picker-chevron {
    flex-shrink: 0;
    width: 12px;
    height: 12px;
    color: var(--fg-muted);
    transition: transform 0.15s ease;
  }

  .model-picker.is-open .model-picker-chevron {
    transform: rotate(180deg);
  }

  .model-picker-panel {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    min-width: 240px;
    max-width: 300px;
    background: var(--bg);
    border: 1px solid var(--nav-border);
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
    padding: 8px;
    z-index: 50;
  }

  .model-picker-panel[hidden] {
    display: none;
  }

  .model-picker-group + .model-picker-group {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--nav-border);
  }

  .model-picker-group-label {
    margin: 2px 8px 4px;
    font-size: 10.5px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--fg-muted);
    opacity: 0.7;
  }

  .model-picker-option {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 8px;

          <svg class="model-picker-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="model-picker-panel" id="model-picker-panel" role="listbox" hidden>
          <div class="model-picker-group">
            <p class="model-picker-group-label">Cloud</p>
            <button class="model-picker-option" type="button" data-mode="cloud" role="option">Simplicity Cloud</button>

        <svg viewBox="0 0 24 24" fill="none">

          <path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

          <circle cx="28" cy="12" r="2.8"/>
          <circle cx="7"  cy="20" r="2.4"/>
          <circle cx="33" cy="20" r="2.4"/>
          <circle cx="20" cy="20" r="2.2"/>
          <circle cx="20" cy="28" r="2"/>

    <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="Scroll to bottom" hidden>↓</button>
      </main>
    </div>

    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
      <div class="settings-modal-head">
        <h2 id="settings-modal-title">Settings</h2>
        <button class="settings-modal-close" id="settings-modal-close" type="button" aria-label="Close settings">
          <svg viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="settings-identity">
        <span class="settings-identity-avatar" id="settings-avatar">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="6"  r="3.2"/>
            <circle cx="12" cy="12" r="2.8"/>
            <circle cx="28" cy="12" r="2.8"/>
            <circle cx="7"  cy="20" r="2.4"/>
            <circle cx="33" cy="20" r="2.4"/>
            <circle cx="20" cy="20" r="2.2"/>
            <circle cx="20" cy="28" r="2"/>
            <circle cx="20" cy="34" r="1.8"/>
          </svg>
        </span>
        <div class="settings-identity-text">
          <p class="settings-identity-name" id="settings-username">—</p>
          <p class="settings-identity-label">Simplicity account</p>

      <div class="settings-modal-row">
        <div class="settings-modal-row-text">
          <h3>Theme</h3>
          <p>Switch between light and dark.</p>
        </div>

          <span class="theme-toggle-dot dot-light"></span>

        </button>

  <script src="/scripts/nav-init.js"></script>
  <script>
    (function () {
      var form = document.getElementById('chat-form');
      var input = document.getElementById('chat-input');
      var messages = document.getElementById('chat-messages');
      var empty = document.getElementById('chat-empty');
      var chatLoading = document.getElementById('chat-loading');
      var chatWrap = document.querySelector('.chat-wrap');
      var questionDock = document.getElementById('question-dock');
      var queueBar = document.getElementById('queue-bar');
      var queueList = document.getElementById('queue-list');
      var queueCount = document.getElementById('queue-count');
      var queueToggle = document.getElementById('queue-toggle');
      var queueEdit = document.getElementById('queue-edit');
      var queueForget = document.getElementById('queue-forget');

      var sidebar = document.getElementById('chat-sidebar');
      var sidebarToggle = document.getElementById('sidebar-toggle');
      var sidebarToggleMobile = document.getElementById('sidebar-toggle-mobile');
      var historyList = document.getElementById('history-list');
      var historyEmpty = document.getElementById('history-empty');

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          sidebar.classList.toggle('is-collapsed');
        });
      }

      function closeMobileSidebar() {
        sidebar.classList.remove('is-open');
      }

      if (sidebarToggleMobile) {
        sidebarToggleMobile.addEventListener('click', function () {
          if (sidebar.classList.contains('is-collapsed')) {
            sidebar.classList.remove('is-collapsed');
          } else {
            sidebar.classList.toggle('is-open');
          }
        });
      }

      document.addEventListener('click', function (event) {
        if (!sidebar.classList.contains('is-open')) return;
        if (sidebar.contains(event.target) || (sidebarToggleMobile && sidebarToggleMobile.contains(event.target))) return;
        closeMobileSidebar();
      });

      function setActiveHistoryItem(conversationId) {
        historyList.querySelectorAll('.history-item').forEach(function (item) {
          item.classList.toggle('is-active', item.getAttribute('data-id') === conversationId);
        });
      }

      function buildHistoryItem(conversation) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'history-item';
        item.setAttribute('data-id', conversation.id);

        var title = document.createElement('span');
        title.className = 'history-item-title';
        title.textContent = conversation.title;
        item.appendChild(title);

        var del = document.createElement('span');
        del.className = 'history-item-delete';
        del.setAttribute('role', 'button');
        del.setAttribute('aria-label', 'Delete conversation');
        del.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
        del.addEventListener('click', function (event) {
          event.stopPropagation();
          deleteConversation(conversation.id);
        });
        item.appendChild(del);

        item.addEventListener('click', function () {
          openConversation(conversation.id, { title: conversation.title });
        });

        return item;
      }

      function loadHistoryList(activeId) {
        fetch('/api/chat/conversations')
          .then(function (response) { return response.ok ? response.json() : { conversations: [] }; })
          .then(function (data) {
            var list = data.conversations || [];
            historyList.innerHTML = '';
            if (!list.length) {
              historyList.appendChild(historyEmpty);
              if (!activeId) setChatLoading(false);
              return;
            }
            var label = document.createElement('p');
            label.className = 'history-section-label';
            label.textContent = 'Recents';
            historyList.appendChild(label);
            list.forEach(function (conversation) {
              historyList.appendChild(buildHistoryItem(conversation));
            });
            if (activeId) setActiveHistoryItem(activeId);
            if (!activeId) setChatLoading(false);
          })
          .catch(function (error) {
            if (!activeId) setChatLoading(false);
            console.error(error);
          });
      }

      function toolLabel(call) {
        var label = TOOL_LABELS[call.name] || call.name;
        if (call.name === 'get_time' && call.result && call.result.time) {
          label += ' → ' + call.result.time;
        }
        return label;
      }

      function humanizeKey(key) {
        return key
          .replace(/_/g, ' ')
          .replace(/([a-z])([A-Z])/g, '$1 $2')
          .replace(/^./, function (c) { return c.toUpperCase(); });
      }

      // Plain-language fallback for any tool result: one "Key: value" line
      // per field instead of a raw JSON dump. Nested objects/arrays get
      // JSON-stringified inline only as a last resort (kept short), since
      // there's no generic way to prose-ify arbitrary nested data.
      function humanizeValue(value) {
        if (value === null || value === undefined) return '—';
        if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
        if (Array.isArray(value)) {
          if (!value.length) return 'None';
          if (value.every(function (v) { return typeof v === 'string' || typeof v === 'number'; })) return value.join(', ');
          return value.map(function (v) { return typeof v === 'object' ? JSON.stringify(v) : v; }).join('; ');
        }
        return JSON.stringify(value);
      }

      function renderFieldList(container, obj) {
        Object.keys(obj).forEach(function (key) {
          var row = document.createElement('div');
          row.className = 'tool-details-field';
          var k = document.createElement('span');
          k.className = 'tool-details-field-key';
          k.textContent = humanizeKey(key) + ':';
          var v = document.createElement('span');
          v.className = 'tool-details-field-value';
          v.textContent = humanizeValue(obj[key]);
          row.appendChild(k);
          row.appendChild(v);
          container.appendChild(row);
        });
      }

      // Per-tool renderers for a fully natural-language summary, checked
      // before falling back to the generic field-list above.
      var TOOL_RESULT_RENDERERS = {
        get_time: function (container, call) {
          var p = document.createElement('p');
          p.className = 'tool-details-prose';
          p.textContent = 'The current time is ' + (call.result && call.result.time || 'unknown') + '.';
          container.appendChild(p);
        },
        ask_question: function (container, call) {
          var questions = (call.result && call.result.questions) || [];
          questions.forEach(function (q) {
            var p = document.createElement('p');
            p.className = 'tool-details-prose';
            p.textContent = q.question + (q.options && q.options.length ? ' (options: ' + q.options.join(', ') + ')' : '');
            container.appendChild(p);
          });
        },
      };

      function buildToolDetails(container, call) {
        container.innerHTML = '';
        var args = call.args || {};
        var renderer = TOOL_RESULT_RENDERERS[call.name];

        if (!renderer && Object.keys(args).length > 0) {
          var argsLabel = document.createElement('div');
          argsLabel.className = 'tool-details-section-label';
          argsLabel.textContent = 'Arguments';
          container.appendChild(argsLabel);
          var argsBox = document.createElement('div');
          argsBox.className = 'tool-details-fields';
          renderFieldList(argsBox, args);
          container.appendChild(argsBox);
        }

        var resultLabel = document.createElement('div');
        resultLabel.className = 'tool-details-section-label';
        resultLabel.textContent = 'Result';
        container.appendChild(resultLabel);

        if (renderer) {
          renderer(container, call);
        } else {
          var resultBox = document.createElement('div');
          resultBox.className = 'tool-details-fields';
          renderFieldList(resultBox, call.result || {});
          container.appendChild(resultBox);
        }

        var duration = typeof call.durationMs === 'number' ? (call.durationMs / 1000).toFixed(2) + ' sec' : null;
        if (duration) {
          var meta = document.createElement('div');
          meta.className = 'tool-details-meta';
          meta.textContent = 'Took ' + duration;
          container.appendChild(meta);
        }
      }

      function createToolStep(call, isActive) {
        var step = document.createElement('details');
        step.className = 'tool-step' + (isActive ? ' is-active' : ' is-done');
        step.open = Boolean(isActive);

        var summary = document.createElement('summary');
        summary.className = 'tool-summary';
        var dot = document.createElement('span');
        dot.className = 'tool-dot';
        var label = document.createElement('span');
        label.className = 'tool-label';
        label.textContent = isActive ? (TOOL_LABELS[call.name] || call.name) + '...' : toolLabel(call);
        var chevron = document.createElement('span');
        chevron.className = 'tool-summary-chevron';
        chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        summary.appendChild(dot);
        summary.appendChild(label);
        summary.appendChild(chevron);
        step.appendChild(summary);

        var detail = document.createElement('div');
        detail.className = 'tool-details';
        if (isActive) {
          var waiting = document.createElement('div');
          waiting.className = 'tool-details-meta';
          waiting.textContent = 'Waiting for result…';
          detail.appendChild(waiting);
        } else {
          buildToolDetails(detail, call);
        }
        step.appendChild(detail);
        return step;
      }

      function finishToolStep(step, call) {
        step.classList.remove('is-active');
        step.classList.add('is-done');
        step.open = false;
        step.querySelector('.tool-label').textContent = toolLabel(call);
        buildToolDetails(step.querySelector('.tool-details'), call);
      }

      function deleteConversation(conversationId) {
        delete conversationCache[conversationId];
        fetch('/api/chat/conversations/' + conversationId, { method: 'DELETE' })
          .then(function () {
            if (conversationId === currentConversationId) startNewChat();
            loadHistoryList(currentConversationId);
          })
          .catch(function (error) { console.error(error); });
      }

      function renderStoredMessage(msg) {
        if (msg.role === 'user') {
          addBubble(msg.content, 'user');
          return;
        }
        if (msg.role !== 'assistant') return;

        enterChatMode();
        var row = document.createElement('div');
        row.className = 'bot-row';
        var logo = document.createElement('span');
        logo.className = 'bot-logo';
        logo.setAttribute('aria-hidden', 'true');
        logo.innerHTML = BOT_LOGO_SVG;
        var content = document.createElement('div');
        content.className = 'bot-content';

        if ((msg.toolCalls && msg.toolCalls.length) || (msg.generationTimes && msg.generationTimes.length)) {
          var trace = document.createElement('div');
          trace.className = 'tool-trace';
          (msg.toolCalls || []).forEach(function (call) {
            trace.appendChild(createToolStep(call, false));
          });
          (msg.generationTimes || []).forEach(function (seconds) {
            var label = document.createElement('div');
            label.className = 'thinking-indicator generation-time-label';
            label.textContent = 'Simplified in ' + seconds + ' sec';
            trace.appendChild(label);
          });
          content.appendChild(trace);
        }

        var div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.innerHTML = renderMarkdown(msg.content);
        content.appendChild(div);
        content.appendChild(makeMeta(msg.content, formatTime(new Date(msg.createdAt)), false, null));
        row.appendChild(logo);
        row.appendChild(content);
        messages.appendChild(row);
      }

      var conversationCache = {};

      function renderConversation(data, conversationId, pushState) {
        currentConversationId = data.id;
        if (chatTopTitle) chatTopTitle.textContent = data.title;
        resetChatView();
        data.messages.forEach(renderStoredMessage);
        if (data.messages.length) {
          chatWrap.classList.add('has-messages');
          hasEnteredChatMode = true;
          refreshRetry();
        }
        setActiveHistoryItem(conversationId);
        closeMobileSidebar();
        chatWrap.scrollTop = chatWrap.scrollHeight;
        setLastConversationCookie(conversationId);
        updateUrlForConversation(conversationId, pushState);
      }

      function openConversation(conversationId, options) {
        var pushState = !options || options.pushState !== false;
        var knownTitle = options && options.title;
        viewGeneration++;
        var requestGeneration = viewGeneration;
        isResponding = false;
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }

        // Optimistic frontend response: update the chrome instantly so the
        // user gets immediate feedback without waiting for the network.
        if (knownTitle && chatTopTitle) chatTopTitle.textContent = knownTitle;
        setActiveHistoryItem(conversationId);
        closeMobileSidebar();
        updateUrlForConversation(conversationId, pushState);
        setLastConversationCookie(conversationId);

        // Instant switch for already-visited conversations — no loader at all.
        var cached = conversationCache[conversationId];
        if (cached) {
          setChatLoading(false);
          renderConversation(cached, conversationId, false);
          return;
        }

        setChatLoading(true);

        fetch('/api/chat/conversations/' + conversationId)
          .then(function (response) {
            if (!response.ok) throw new Error('not_found');
            return response.json();
          })
          .then(function (data) {
            if (requestGeneration !== viewGeneration) return;
            setChatLoading(false);
            conversationCache[data.id] = data;
            renderConversation(data, conversationId, false);
          })
          .catch(function (error) {
            if (requestGeneration !== viewGeneration) return;
            setChatLoading(false);
            if (error && error.message === 'not_found') clearLastConversationCookie();
            console.error(error);
          });
      }

      var hasEnteredChatMode = false;

      function enterChatMode() {
        if (empty && !empty.classList.contains('is-leaving')) {
          empty.classList.add('is-leaving');
          setTimeout(function () {
            if (empty && empty.parentNode) empty.remove();
          }, 280);
        }
        if (!hasEnteredChatMode) {
          hasEnteredChatMode = true;
          chatWrap.classList.add('has-messages');
          form.classList.add('is-settling');
          form.addEventListener('animationend', function handler() {
            form.classList.remove('is-settling');
            form.removeEventListener('animationend', handler);
          });
        }
      }

      var isResponding = false;
      var queue = [];

      function renderQueue() {
        queueCount.textContent = String(queue.length);
        queueBar.hidden = queue.length === 0;
        while (queueList.firstChild) queueList.removeChild(queueList.firstChild);
        queue.forEach(function (text) {
          var item = document.createElement('div');
          item.className = 'queue-item';
          item.textContent = text;
          queueList.appendChild(item);
        });
        positionScrollBtn();
      }

      function enqueueMessage(text) {
        queue.push(text);
        renderQueue();
      }

      function onBotDone() {
        isResponding = false;
        if (queue.length) {
          var next = queue.shift();
          renderQueue();
          handleUserMessage(next);
        } else {
          if (followOutput) scrollPageBottom(false);
          updateScrollBtn();
        }
      }

      queueToggle.addEventListener('click', function () {
        var collapsed = queueBar.classList.toggle('is-collapsed');
        queueToggle.setAttribute('aria-expanded', String(!collapsed));
        positionScrollBtn();
      });

      queueEdit.addEventListener('click', function () {
        if (!queue.length) return;
        input.value = queue.join('\n');
        queue = [];
        renderQueue();
        autosizeInput();
        input.focus();
      });

      queueForget.addEventListener('click', function () {
        queue = [];
        renderQueue();
      });

      function autosizeInput() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autosizeInput);

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      var emptyInner = empty ? empty.innerHTML : '';

      function setChatLoading(isLoading) {
        if (chatLoading) chatLoading.hidden = !isLoading;
        if (chatWrap) chatWrap.classList.toggle('is-loading', isLoading);
      }

      var newChatBtn = document.getElementById('new-chat-btn');
      var chatTopTitle = document.getElementById('chat-top-title');
      var currentConversationId = null;
      var viewGeneration = 0;

      function resetChatView() {
        messages.innerHTML = '';
        var d = document.createElement('div');
        d.className = 'chat-empty';
        d.id = 'chat-empty';
        d.innerHTML = emptyInner;
        messages.appendChild(d);
        empty = d;
        chatWrap.classList.remove('has-messages');
        hasEnteredChatMode = false;
        hideFollowup();
        queue = [];
        renderQueue();
        input.value = '';
        autosizeInput();
        input.focus();
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }
        chatWrap.scrollTop = 0;
        updateScrollBtn();
      }

      function startNewChat(options) {
        var pushState = !options || options.pushState !== false;
        viewGeneration++;
        // New chat is purely local — never show the loader here, and clear
        // any loader left behind by an in-flight conversation fetch.
        isResponding = false;
        setChatLoading(false);
        currentConversationId = null;
        if (chatTopTitle) chatTopTitle.textContent = 'New chat';
        resetChatView();
        setActiveHistoryItem(null);
        closeMobileSidebar();
        clearLastConversationCookie();
        updateUrlForNewChat(pushState);
      }

      if (newChatBtn) newChatBtn.addEventListener('click', startNewChat);

      autosizeInput();

      var micBtn = document.getElementById('chat-mic');
      var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (micBtn && SpeechRecognitionCtor) {
        micBtn.hidden = false;
        var recognition = new SpeechRecognitionCtor();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        var isRecording = false;

        recognition.addEventListener('result', function (event) {
          var transcript = event.results[0][0].transcript;
          input.value = (input.value ? input.value + ' ' : '') + transcript;
          autosizeInput();
          input.focus();
        });

        recognition.addEventListener('end', function () {
          isRecording = false;
          micBtn.classList.remove('is-recording');
        });

        recognition.addEventListener('error', function () {
          isRecording = false;
          micBtn.classList.remove('is-recording');
        });

        micBtn.addEventListener('click', function () {
          if (isRecording) {
            recognition.stop();
            return;
          }
          isRecording = true;
          micBtn.classList.add('is-recording');
          recognition.start();
        });
      }

      // ---------- Model picker: Simplicity Cloud / Simplicity Local ----------
      var HW_SCAN_STORAGE_KEY = 'simplicity-local-hw-scan';
      var INSTALLED_MODELS_STORAGE_KEY = 'simplicity-local-installed-models';
      var SELECTED_MODEL_STORAGE_KEY = 'simplicity-local-selected-model';

      function readLocalStorageJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var parsed = JSON.parse(raw);
          return parsed === null || parsed === undefined ? fallback : parsed;
        } catch (e) {
          return fallback;
        }
      }

      function writeLocalStorageJSON(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          // Storage disabled/full (e.g. Safari private mode) — best-effort only.
        }
      }

      function getInstalledLocalModels() {
        var list = readLocalStorageJSON(INSTALLED_MODELS_STORAGE_KEY, []);
        return Array.isArray(list) ? list : [];
      }

      function localModelDisplayName(modelId) {
        // "Llama-3.2-3B-Instruct-q4f16_1-MLC" -> "Llama 3.2 3B Instruct"
        return modelId
          .replace(/-q\d.*$/i, '')
          .replace(/-MLC.*$/i, '')
          .replace(/-/g, ' ');
      }

      var currentModelMode = 'cloud';
      var currentLocalModelId = null;

      function loadModelSelection() {
        var saved = readLocalStorageJSON(SELECTED_MODEL_STORAGE_KEY, null);
        if (!saved || (saved.mode !== 'local' && saved.mode !== 'cloud')) return;
        if (saved.mode === 'local') {
          var installed = getInstalledLocalModels();
          if (!saved.localModelId || installed.indexOf(saved.localModelId) === -1) {
            // Selected model no longer installed — never land on a missing model.
            return;
          }
        }
        currentModelMode = saved.mode;
        currentLocalModelId = saved.mode === 'local' ? saved.localModelId : null;
      }

      function saveModelSelection() {
        writeLocalStorageJSON(SELECTED_MODEL_STORAGE_KEY, { mode: currentModelMode, localModelId: currentLocalModelId });
      }

      var modelPicker = document.getElementById('model-picker');

      function formatTime(date) {

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Minimal markdown renderer for AI replies. Input is escaped to plain
      // text FIRST, then markdown syntax is layered on top — so nothing the
      // model outputs (or a prompt-injected instruction) can ever produce a
      // live tag; every literal "<" in the reply stays inert text.
      function renderMarkdown(raw) {
        var blocks = [];
        var text = escapeHtml(raw).replace(/\r\n/g, '\n');

        // Fenced code blocks first — their contents must survive untouched
        // by every other rule below (bold/italic/links inside code would be
        // wrong), so pull them out and swap back in at the very end.
        text = text.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
          var token = ' BLOCK' + blocks.length + ' ';
          blocks.push('<pre class="md-code-block"><code>' + code.replace(/\n$/, '') + '</code></pre>');
          return token;
        });

        // Inline code next, same reasoning — protect before bold/italic run.
        text = text.replace(/`([^`\n]+)`/g, function (m, code) {
          var token = ' BLOCK' + blocks.length + ' ';
          blocks.push('<code class="md-inline-code">' + code + '</code>');
          return token;
        });

        text = text
          .replace(/^### (.+)$/gm, '<h3 class="md-h3">$1</h3>')
          .replace(/^## (.+)$/gm, '<h2 class="md-h2">$1</h2>')
          .replace(/^# (.+)$/gm, '<h1 class="md-h1">$1</h1>')
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
          // Non-standard, house convention: ==text== marks an important
          // line/passage as a solid orange highlight block. No official
          // markdown spec covers this, so the model is told about it
          // explicitly in the system prompt. Can span multiple sentences
          // (and the newlines between them), so it's pulled out as a
          // protected block like code, rendered after the <br> pass below
          // rather than inline, so it becomes its own block element instead
          // of an inline span broken across line breaks.
          .replace(/==([\s\S]+?)==/g, function (m, inner) {
            var token = ' BLOCK' + blocks.length + ' ';
            blocks.push('<div class="md-hl">' + inner.trim().replace(/\n/g, '<br>') + '</div>');
            return token;
          })
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        // Group consecutive "- "/"1. " lines into real <ul>/<ol> blocks, and
        // a header + "---|---" separator + data rows into a real <table>.
        var lines = text.split('\n');
        var out = [];
        var listBuffer = [];
        var listType = null;
        function flushList() {
          if (!listBuffer.length) return;
          var tag = listType === 'ol' ? 'ol' : 'ul';
          out.push('<' + tag + ' class="md-list">' + listBuffer.map(function (item) { return '<li>' + item + '</li>'; }).join('') + '</' + tag + '>');
          listBuffer = [];
          listType = null;
        }
        function splitTableRow(line) {
          var cells = line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
          return cells.map(function (c) { return c.trim(); });
        }
        function isTableSeparator(line) {
          return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(line) && line.indexOf('-') !== -1;
        }
        for (var li = 0; li < lines.length; li++) {
          var line = lines[li];
          var ulMatch = line.match(/^[-*]\s+(.+)$/);
          var olMatch = line.match(/^\d+\.\s+(.+)$/);
          var nextLine = lines[li + 1];
          if (line.indexOf('|') !== -1 && nextLine && isTableSeparator(nextLine) && !ulMatch) {
            flushList();
            var headerCells = splitTableRow(line);
            var token = ' BLOCK' + blocks.length + ' ';
            var rows = [];
            var scan = li + 2;
            while (scan < lines.length && lines[scan].indexOf('|') !== -1 && lines[scan].trim() !== '') {
              rows.push(splitTableRow(lines[scan]));
              scan++;
            }
            var html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
              headerCells.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
              '</tr></thead><tbody>' +
              rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + (c || '') + '</td>'; }).join('') + '</tr>'; }).join('') +
              '</tbody></table></div>';
            blocks.push(html);
            out.push(token);
            li = scan - 1;
            continue;
          }
          if (ulMatch) {
            if (listType && listType !== 'ul') flushList();
            listType = 'ul';
            listBuffer.push(ulMatch[1]);
          } else if (olMatch) {
            if (listType && listType !== 'ol') flushList();
            listType = 'ol';
            listBuffer.push(olMatch[1]);
          } else {
            flushList();
            out.push(line);
          }
        }
        flushList();
        text = out.join('\n');

        // Remaining bare newlines become <br> — anything already inside a
        // block-level tag we just built (list/heading/code) keeps its own
        // formatting, so this only affects plain paragraph text.
        text = text.replace(/\n/g, '<br>');

        text = text.replace(/ BLOCK(\d+) /g, function (m, i) {
          return blocks[Number(i)];
        });

        return text;
      }

      function copyText(text, btn) {
        function done() {
          var original = btn.getAttribute('data-label') || 'Copy';
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = original; }, 1200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      }

      function typewriteText(el, fullText, done, isCancelled) {
        var i = 0;
        el.textContent = '';
        // Reveal several characters per animation tick so long replies (the
        // common case once markdown/tables/code blocks are involved) finish
        // in a reasonable time instead of trickling out for several seconds.
        var chunk = Math.max(3, Math.ceil(fullText.length / 120));
        var timer = setInterval(function () {
          if (isCancelled && isCancelled()) {
            clearInterval(timer);
            return;
          }
          i += chunk;
          // Render markdown live as it types (not just at the end) so the
          // user isn't staring at raw **asterisks**/## symbols for the
          // whole animation — a long reply used to look "stuck" in plain
          // text until typing finished. A half-open marker (e.g. a "**"
          // with no closing pair yet) just renders as literal text for a
          // moment, which reads fine — far better than several seconds of
          // unformatted markdown.
          el.innerHTML = renderMarkdown(fullText.slice(0, i));
          if (followOutput) {
            scrollPageBottom(false);
            if (isResponding) ensureFollowLoop();
          }
          if (i >= fullText.length) {
            clearInterval(timer);
            el.innerHTML = renderMarkdown(fullText);
            if (done) done();
          }
        }, 12);
      }

      function renderQuestionCard(container, questions, onSubmit) {
        var answers = new Array(questions.length).fill(null);

        container.appendChild(card);

            return q.question + ' ' + answers[i];

        function renderStep() {
          card.innerHTML = '';
          var q = questions[qIndex];
          var rowsCount = (q.options || []).length + 1;
          var selected = 0;

          var head = document.createElement('div');
          head.className = 'question-head';
          var qText = document.createElement('p');
          qText.className = 'question-text';
          qText.textContent = q.question;

          if (questions.length > 1) {

          list.className = 'question-list';

          function lockIn(answerText) {

            if (qIndex < questions.length - 1) {
              qIndex++;

            }
          }

          var rowEls = [];

          (q.options || []).forEach(function (optionText, i) {
            var row = document.createElement('button');
            row.type = 'button';

            row.appendChild(num);
            row.appendChild(label);
            row.appendChild(hint);
            row.addEventListener('click', function () { lockIn(optionText); });
            row.addEventListener('mouseenter', function () { setSelected(i); });
            list.appendChild(row);
            rowEls.push(row);
          });

          var customRowIndex = rowEls.length;
          var customRow = document.createElement('div');
          customRow.className = 'question-row question-row-custom';
          var customIcon = document.createElement('span');
          customIcon.className = 'question-row-num';
          customIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 000-2.8l-1.2-1.2a2 2 0 00-2.8 0L4 16v4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
          var customInput = document.createElement('input');
          customInput.type = 'text';
          customInput.className = 'question-row-input';
          customInput.placeholder = (q.options && q.options.length) ? 'Something else…' : 'Type your answer…';
          customInput.setAttribute('aria-label', 'Your answer to: ' + q.question);
          customRow.appendChild(customIcon);
          customRow.appendChild(customInput);
          if (q.options && q.options.length) {
            var skipBtn = document.createElement('button');
            skipBtn.type = 'button';
            skipBtn.className = 'question-skip-btn';
            skipBtn.textContent = 'Skip';
            skipBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              lockIn('(skipped)');
            });
            customRow.appendChild(skipBtn);
          }
          customRow.addEventListener('click', function (e) {
            if (e.target === customInput || e.target.closest('.question-skip-btn')) return;
            customInput.focus();
          });
          customRow.addEventListener('mouseenter', function () { setSelected(customRowIndex); });
          list.appendChild(customRow);
          rowEls.push(customRow);

          customInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              var val = customInput.value.trim();
              if (val) lockIn(val);

          function setSelected(i) {
            selected = i;
            rowEls.forEach(function (row, idx) { row.classList.toggle('is-selected', idx === i); });
          }
          setSelected(0);

          function onKeydown(e) {
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              setSelected((selected + 1) % rowEls.length);
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              setSelected((selected - 1 + rowEls.length) % rowEls.length);
            } else if (e.key === 'Enter' && document.activeElement !== customInput) {
              e.preventDefault();

      function requestFailedMessage(error) {
        if (error && error.message === 'rate_limited') {
          return "You're sending messages too quickly. Give it a moment and try again.";
        }
        if (error && error.message && error.message !== 'request_failed') {
          return error.message;
        }
        return "Something went wrong reaching Simplicity. Please try again.";
      }

      function readMessageStream(response, onEvent) {
        if (!response.body || !response.body.getReader) {
          return response.text().then(function (text) {
            text.split('\n').forEach(function (line) {
              if (line.trim()) onEvent(JSON.parse(line));
            });
          });
        }

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function readNext() {
          return reader.read().then(function (part) {
            buffer += decoder.decode(part.value || new Uint8Array(), { stream: !part.done });
            var lines = buffer.split('\n');
            buffer = lines.pop();
            lines.forEach(function (line) {
              if (line.trim()) onEvent(JSON.parse(line));
            });
            if (part.done) {
              if (buffer.trim()) onEvent(JSON.parse(buffer));
              return;
            }
            return readNext();
          });
        }

        return readNext();
      }

      function sendBotReply(sourceMessage) {

        var requestGeneration = viewGeneration;

        var row = document.createElement('div');

        content.className = 'bot-content';

      }

      function historyTitleFor(conversationId) {
        var item = historyList.querySelector('.history-item[data-id="' + conversationId + '"] .history-item-title');
        return item ? item.textContent : null;
      }

      window.addEventListener('popstate', function (event) {
        var urlConversationId = (event.state && event.state.conversationId) || getConversationIdFromUrl();
        if (urlConversationId) {
          if (urlConversationId !== currentConversationId) openConversation(urlConversationId, { pushState: false, title: historyTitleFor(urlConversationId) });
        } else if (currentConversationId !== null) {
          startNewChat({ pushState: false });
        }
      });

      var urlConversationId = getConversationIdFromUrl();
      setChatLoading(true);
      loadHistoryList(urlConversationId);
      if (urlConversationId) openConversation(urlConversationId, { pushState: false });
      else setChatLoading(false);
    })();
  </script>
</body>
</html>
