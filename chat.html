<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Simplicity</title>
<meta name="description" content="Chat with Simplicity.">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var match = document.cookie.match(/(?:^|; )simplicity-theme=([^;]*)/);
    var saved = match ? decodeURIComponent(match[1]) : null;
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    window.simplicitySetThemeCookie = function (value) {
      var consentMatch = document.cookie.match(/(?:^|; )simplicity-consent=([^;]*)/);
      var consent = consentMatch ? decodeURIComponent(consentMatch[1]) : null;
      if (consent !== 'accepted') return;
      var date = new Date();
      date.setTime(date.getTime() + 365 * 24 * 60 * 60 * 1000);
      document.cookie = 'simplicity-theme=' + encodeURIComponent(value) + '; expires=' + date.toUTCString() + '; path=/; SameSite=Lax';
    };
  })();
</script>
<style>
  html[data-theme="light"] { background: #F3F1EC; color: #000; }
  html[data-theme="dark"] { background: #0A0A0A; color: #F3F1EC; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* ---------- Chat-specific navigation controls ---------- */
  nav {
    min-height: 0;
  }
  nav .nav-dot {
    width: 16px;
    height: 16px;
  }
  nav .nav-wordmark {
    font-size: 13px;
  }
  nav .nav-links {
    gap: 20px;
  }
  nav .nav-links a,
  nav .nav-dropdown-trigger {
    font-size: 13px;
  }
  nav .nav-dropdown-panel {
    padding: 20px 24px;
  }
  nav .dropdown-links.large a {
    font-size: 20px;
  }
  nav .btn {
    padding: 8px 16px;
    font-size: 13px;
  }
  nav .settings-btn {
    width: 30px;
    height: 30px;
  }
  nav .theme-toggle {
    width: 46px;
    height: 24px;
  }
  nav .theme-toggle-thumb {
    width: 16px;
    height: 16px;
  }
  html[data-theme="dark"] nav .theme-toggle-thumb {
    transform: translateX(22px);
  }

  /* ---------- Brand application (from brand.html) ----------
     Brand colors: Accent #FF5A1F, Hover #F04E15, Light #F3F1EC,
     Dark #0A0A0A, Muted #6B6A63. Poppins + dot-mark language. */
  ::selection {
    background: var(--accent);
    color: #fff;
  }

  /* ---------- Very simple chat layout ---------- */
  html {
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar {
    display: none;
  }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .chat-wrap {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    min-height: calc(100dvh - 57px);
  }

  .chat-wrap.has-messages {
    justify-content: flex-end;
  }

  .chat-messages {
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: center;
  }

  .chat-wrap.has-messages .chat-messages {
    flex: 1;
    justify-content: flex-start;
  }

  .chat-empty {
    text-align: center;
    color: var(--fg-muted);
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  .chat-empty.is-leaving {
    opacity: 0;
    transform: translateY(-10px) scale(0.97);
  }

  @keyframes chat-form-settle {
    from {
      transform: translateY(-18px);
    }
    to {
      transform: translateY(0);
    }
  }

  .chat-form.is-settling {
    animation: chat-form-settle 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes chat-bubble-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg-user,
  .bot-row {
    animation: chat-bubble-in 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .chat-mark {
    display: inline-flex;
    margin-bottom: 18px;
  }

  .chat-mark svg {
    width: 40px;
    height: 40px;
  }

  .chat-mark circle {
    fill: var(--fg);
  }

  .chat-empty strong {
    display: block;
    color: var(--fg);
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .chat-bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .chat-bubble.user {
    background: transparent;
    color: var(--fg);
    border: 1.5px dashed rgba(255, 90, 31, 0.55);
  }

  .chat-bubble.bot {
    background: transparent;
    color: var(--fg);
    border: none;
    padding: 2px 0;
    max-width: 100%;
  }

  .msg-user {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    max-width: 75%;
  }

  .bot-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    align-self: flex-start;
    max-width: 100%;
    width: 100%;
  }

  .bot-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .bot-logo {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 2px;
  }

  .bot-logo circle {
    fill: var(--fg);
  }

  .msg-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 6px;
    font-size: 11.5px;
    line-height: 1;
    color: var(--fg-muted);
    opacity: 0.7;
  }

  .msg-user .msg-meta {
    justify-content: flex-end;
  }

  .meta-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: inherit;
    color: inherit;
    cursor: pointer;
  }

  .meta-btn:hover {
    color: var(--fg);
    opacity: 1;
    text-decoration: underline;
  }

  .followup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 2px 0 0 32px;
    align-self: flex-start;
  }

  .followup-chip {
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg);
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .followup-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tool-trace {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 2px 0 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--fg-muted);
  }

  .tool-trace[hidden] {
    display: none;
  }

  .tool-step {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tool-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0.35;
  }

  .tool-step.is-active .tool-dot {
    opacity: 0.7;
  }

  .tool-step.is-done .tool-dot {
    opacity: 1;
  }

  .tool-step.is-done .tool-label::after {
    content: " ✓";
    color: var(--accent);
  }

  .chat-form {
    position: sticky;
    bottom: 12px;
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    border: 1px solid var(--btn-outline-border);
    border-radius: 24px;
    padding: 8px 8px 8px 18px;
    background: var(--bg);
    transition: border-color 0.15s ease;
  }

  .chat-form:focus-within {
    border-color: var(--accent);
  }

  .chat-form textarea {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    resize: none;
    overflow-y: auto;
    max-height: 140px;
    padding: 10px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .chat-form textarea::-webkit-scrollbar {
    display: none;
  }

  .chat-form textarea::placeholder {
    color: var(--fg-muted);
    user-select: none;
    -webkit-user-select: none;
  }

  .chat-send {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .chat-send:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  .chat-send svg {
    width: 20px;
    height: 20px;
  }

  .chat-send circle {
    fill: #fff;
  }

  .queue-bar {
    position: sticky;
    bottom: 70px;
    z-index: 19;
    background: var(--bg);
    border: 1.5px solid #55534e;
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .queue-bar[hidden] {
    display: none;
  }

  .queue-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    cursor: pointer;
  }

  .queue-caret {
    transition: transform 0.15s ease;
  }

  .queue-bar.is-collapsed .queue-caret {
    transform: rotate(-90deg);
  }

  .queue-bar.is-collapsed .queue-list,
  .queue-bar.is-collapsed .queue-actions {
    display: none;
  }

  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .queue-list::-webkit-scrollbar {
    display: none;
  }

  .queue-item {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--fg-muted);
    border-top: 1px solid var(--btn-outline-border);
    padding-top: 6px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .queue-item:first-child {
    border-top: none;
    padding-top: 0;
  }

  .queue-actions {
    display: flex;
    gap: 8px;
  }

  .queue-actions button {
    flex: 1;
    border-radius: 999px;
    padding: 7px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--btn-outline-border);
  }

  .queue-actions button:hover {
    border-color: #55534e;
    color: #55534e;
  }

  .chat-top {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: var(--bg);
    user-select: none;
    -webkit-user-select: none;
  }

  .chat-brand-mount,
  .chat-account-mount {
    position: static;
    display: flex;
    align-items: center;
  }

  .chat-top a.brand-mark {
    line-height: 1;
  }

  .chat-top .account-btn {
    width: 32px;
    height: 32px;
    font-size: 13px;
  }

  .chat-top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-clear {
    border: 1px solid var(--btn-outline-border);
    background: transparent;
    color: var(--fg-muted);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .chat-clear:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .scroll-bottom {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 88px;
    z-index: 30;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--btn-outline-border);
    background: var(--bg);
    color: var(--fg);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scroll-bottom:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .scroll-bottom[hidden] {
    display: none;
  }

</style>
</head>
<body data-no-nav data-require-auth>
  <header class="chat-top">
    <div class="chat-brand-mount" data-brand-mark></div>

    <div class="chat-top-actions">
      <button class="chat-clear" id="chat-clear" type="button">Clear chat</button>
      <div class="chat-account-mount">
      <div class="account-dropdown" id="account-dropdown">
        <button class="account-btn" id="account-toggle" aria-label="Account" aria-expanded="false" aria-controls="account-panel">?</button>
        <div class="account-panel" id="account-panel">
          <div class="account-panel-head">
            <p class="account-panel-name" id="account-panel-username">—</p>
          </div>
          <a class="account-row" href="/settings.html">Settings</a>
          <button class="account-row is-button" id="account-logout" type="button">Log out</button>
        </div>
      </div>
      </div>
    </div>
  </header>
  <main class="chat-wrap">
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <span class="chat-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="6"  r="3.2"/>
            <circle cx="12" cy="12" r="2.8"/>
            <circle cx="28" cy="12" r="2.8"/>
            <circle cx="7"  cy="20" r="2.4"/>
            <circle cx="33" cy="20" r="2.4"/>
            <circle cx="20" cy="20" r="2.2"/>
            <circle cx="20" cy="28" r="2"/>
            <circle cx="20" cy="34" r="1.8"/>
          </svg>
        </span>
        <strong>What can I help with?</strong>
        Ask anything to get started.
      </div>
    </div>

    <div class="queue-bar" id="queue-bar" hidden>
      <button class="queue-head" id="queue-toggle" type="button" aria-expanded="true" aria-controls="queue-list">
        <span>Queued (<span id="queue-count">0</span>) — waiting for reply</span>
        <span class="queue-caret" aria-hidden="true">▾</span>
      </button>
      <div class="queue-list" id="queue-list"></div>
      <div class="queue-actions">
        <button type="button" id="queue-edit">Edit</button>
        <button type="button" id="queue-forget">Forget</button>
      </div>
    </div>

    <form class="chat-form" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Message Simplicity…" autocomplete="off" aria-label="Message"></textarea>
      <button type="submit" class="chat-send" aria-label="Send">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="6"  r="3.2"/>
          <circle cx="12" cy="12" r="2.8"/>
          <circle cx="28" cy="12" r="2.8"/>
          <circle cx="7"  cy="20" r="2.4"/>
          <circle cx="33" cy="20" r="2.4"/>
          <circle cx="20" cy="20" r="2.2"/>
          <circle cx="20" cy="28" r="2"/>
          <circle cx="20" cy="34" r="1.8"/>
        </svg>
      </button>
    </form>
    <button class="scroll-bottom" id="scroll-bottom" type="button" aria-label="Scroll to bottom" hidden>↓</button>
  </main>

  <script src="/scripts/nav-init.js"></script>
  <script>
    (function () {
      var form = document.getElementById('chat-form');
      var input = document.getElementById('chat-input');
      var messages = document.getElementById('chat-messages');
      var empty = document.getElementById('chat-empty');
      var chatWrap = document.querySelector('.chat-wrap');
      var queueBar = document.getElementById('queue-bar');
      var queueList = document.getElementById('queue-list');
      var queueCount = document.getElementById('queue-count');
      var queueToggle = document.getElementById('queue-toggle');
      var queueEdit = document.getElementById('queue-edit');
      var queueForget = document.getElementById('queue-forget');

      var hasEnteredChatMode = false;

      function enterChatMode() {
        if (empty && !empty.classList.contains('is-leaving')) {
          empty.classList.add('is-leaving');
          setTimeout(function () {
            if (empty && empty.parentNode) empty.remove();
          }, 280);
        }
        if (!hasEnteredChatMode) {
          hasEnteredChatMode = true;
          chatWrap.classList.add('has-messages');
          form.classList.add('is-settling');
          form.addEventListener('animationend', function handler() {
            form.classList.remove('is-settling');
            form.removeEventListener('animationend', handler);
          });
        }
      }

      var isResponding = false;
      var queue = [];

      function renderQueue() {
        queueCount.textContent = String(queue.length);
        queueBar.hidden = queue.length === 0;
        while (queueList.firstChild) queueList.removeChild(queueList.firstChild);
        queue.forEach(function (text) {
          var item = document.createElement('div');
          item.className = 'queue-item';
          item.textContent = text;
          queueList.appendChild(item);
        });
        positionScrollBtn();
      }

      function enqueueMessage(text) {
        queue.push(text);
        renderQueue();
      }

      function onBotDone() {
        isResponding = false;
        if (queue.length) {
          var next = queue.shift();
          renderQueue();
          handleUserMessage(next);
        } else {
          if (followOutput) scrollPageBottom(false);
          updateScrollBtn();
        }
      }

      queueToggle.addEventListener('click', function () {
        var collapsed = queueBar.classList.toggle('is-collapsed');
        queueToggle.setAttribute('aria-expanded', String(!collapsed));
        positionScrollBtn();
      });

      queueEdit.addEventListener('click', function () {
        if (!queue.length) return;
        input.value = queue.join('\n');
        queue = [];
        renderQueue();
        autosizeInput();
        input.focus();
      });

      queueForget.addEventListener('click', function () {
        queue = [];
        renderQueue();
      });

      function autosizeInput() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autosizeInput);

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      var emptyInner = empty ? empty.innerHTML : '';
      var clearBtn = document.getElementById('chat-clear');
      clearBtn.addEventListener('click', function () {
        messages.innerHTML = '';
        var d = document.createElement('div');
        d.className = 'chat-empty';
        d.id = 'chat-empty';
        d.innerHTML = emptyInner;
        messages.appendChild(d);
        empty = d;
        chatWrap.classList.remove('has-messages');
        hasEnteredChatMode = false;
        hideFollowup();
        queue = [];
        renderQueue();
        input.value = '';
        autosizeInput();
        input.focus();
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }
        window.scrollTo(0, 0);
        updateScrollBtn();
      });

      autosizeInput();

      var scrollBtn = document.getElementById('scroll-bottom');
      var followOutput = false;
      var followTimer = null;
      var lastY = window.scrollY;
      var lastMove = Date.now();

      function distFromBottom() {
        return document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
      }

      function isAtBottom() {
        return distFromBottom() < 120;
      }

      function scrollPageBottom(smooth) {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }

      function updateScrollBtn() {
        scrollBtn.hidden = isAtBottom();
      }

      function positionScrollBtn() {
        if (queueBar.hidden) {
          scrollBtn.style.bottom = '';
        } else {
          scrollBtn.style.bottom = (70 + queueBar.offsetHeight + 12) + 'px';
        }
      }

      function ensureFollowLoop() {
        if (followTimer) return;
        lastY = window.scrollY;
        lastMove = Date.now();
        followTimer = setInterval(function () {
          if (!isResponding || !followOutput) {
            clearInterval(followTimer);
            followTimer = null;
            return;
          }
          var y = window.scrollY;
          if (y !== lastY) {
            lastY = y;
            lastMove = Date.now();
          }
          if (Date.now() - lastMove > 1000) {
            clearInterval(followTimer);
            followTimer = null;
            return;
          }
          scrollPageBottom(false);
        }, 100);
      }

      function noteUserScroll() {
        followOutput = false;
        if (followTimer) {
          clearInterval(followTimer);
          followTimer = null;
        }
        updateScrollBtn();
      }

      window.addEventListener('scroll', function () {
        updateScrollBtn();
      }, { passive: true });
      window.addEventListener('resize', function () {
        positionScrollBtn();
      });
      window.addEventListener('wheel', noteUserScroll, { passive: true });
      window.addEventListener('touchmove', noteUserScroll, { passive: true });
      window.addEventListener('keydown', function (e) {
        if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].indexOf(e.key) !== -1) noteUserScroll();
      });

      scrollBtn.addEventListener('click', function () {
        followOutput = true;
        scrollPageBottom(true);
        updateScrollBtn();
        if (isResponding) ensureFollowLoop();
      });

      updateScrollBtn();

      var BOT_LOGO_SVG = '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="6" r="3.2"/><circle cx="12" cy="12" r="2.8"/><circle cx="28" cy="12" r="2.8"/><circle cx="7" cy="20" r="2.4"/><circle cx="33" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.2"/><circle cx="20" cy="28" r="2"/><circle cx="20" cy="34" r="1.8"/></svg>';

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function copyText(text, btn) {
        function done() {
          var original = btn.getAttribute('data-label') || 'Copy';
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = original; }, 1200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      }

      function typewriteText(el, fullText, done) {
        var i = 0;
        el.textContent = '';
        var timer = setInterval(function () {
          i++;
          el.textContent = fullText.slice(0, i);
          messages.scrollTop = messages.scrollHeight;
          if (isResponding && followOutput) {
            scrollPageBottom(false);
            ensureFollowLoop();
          }
          if (i >= fullText.length) {
            clearInterval(timer);
            if (done) done();
          }
        }, 55);
      }

      var followupRow = document.createElement('div');
      followupRow.className = 'followup-row';
      var followupBtn = document.createElement('button');
      followupBtn.type = 'button';
      followupBtn.className = 'followup-chip';
      followupBtn.textContent = 'What is the time?';
      followupBtn.setAttribute('aria-label', 'Ask what is the time');
      followupBtn.addEventListener('click', function () {
        handleUserMessage('What is the time?');
      });
      followupRow.appendChild(followupBtn);

      function hideFollowup() {
        if (followupRow.parentNode) followupRow.parentNode.removeChild(followupRow);
      }

      function showFollowup() {
        hideFollowup();
        var rows = messages.querySelectorAll('.bot-row');
        if (!rows.length) return;
        var last = rows[rows.length - 1];
        last.parentNode.insertBefore(followupRow, last.nextSibling);
        messages.scrollTop = messages.scrollHeight;
      }

      function makeMeta(text, time, showRetry, onRetry) {
        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        var timeEl = document.createElement('span');
        timeEl.className = 'msg-time';
        timeEl.textContent = time;
        meta.appendChild(timeEl);
        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'meta-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.setAttribute('data-label', 'Copy');
        copyBtn.setAttribute('aria-label', 'Copy message');
        copyBtn.addEventListener('click', function () { copyText(text, copyBtn); });
        meta.appendChild(copyBtn);
        if (showRetry) {
          var retryBtn = document.createElement('button');
          retryBtn.type = 'button';
          retryBtn.className = 'meta-btn meta-retry';
          retryBtn.textContent = 'Retry';
          retryBtn.setAttribute('aria-label', 'Retry response');
          retryBtn.addEventListener('click', onRetry);
          meta.appendChild(retryBtn);
        }
        return meta;
      }

      function refreshRetry() {
        var rows = messages.querySelectorAll('.bot-row');
        rows.forEach(function (row, i) {
          var old = row.querySelector('.meta-retry');
          if (old) old.remove();
          if (i === rows.length - 1) {
            var meta = row.querySelector('.msg-meta');
            var bubble = row.querySelector('.chat-bubble.bot');
            if (meta && bubble) {
              var retryBtn = document.createElement('button');
              retryBtn.type = 'button';
              retryBtn.className = 'meta-btn meta-retry';
              retryBtn.textContent = 'Retry';
              retryBtn.setAttribute('aria-label', 'Retry response');
              retryBtn.addEventListener('click', function () { retryResponse(row); });
              meta.appendChild(retryBtn);
            }
          }
        });
      }

      var TOOL_LABELS = {
        get_time: 'Checking the time'
      };

      function retryResponse(row) {
        var sourceMessage = row.getAttribute('data-source');
        if (!sourceMessage) return;
        row.remove();
        sendBotReply(sourceMessage);
      }

      function addBubble(text, who) {
        enterChatMode();
        var time = formatTime(new Date());
        var wrap = document.createElement('div');
        wrap.className = 'msg-user';
        var userDiv = document.createElement('div');
        userDiv.className = 'chat-bubble user';
        userDiv.textContent = text;
        wrap.appendChild(userDiv);
        wrap.appendChild(makeMeta(text, time, false, null));
        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
      }

      function requestFailedMessage(error) {
        if (error && error.message === 'rate_limited') {
          return "You're sending messages too quickly. Give it a moment and try again.";
        }
        if (error && error.message && error.message !== 'request_failed') {
          return error.message;
        }
        return "Something went wrong reaching Simplicity. Please try again.";
      }

      function sendBotReply(sourceMessage) {
        hideFollowup();

        var row = document.createElement('div');
        row.className = 'bot-row';
        row.setAttribute('data-source', sourceMessage);
        var logo = document.createElement('span');
        logo.className = 'bot-logo';
        logo.setAttribute('aria-hidden', 'true');
        logo.innerHTML = BOT_LOGO_SVG;
        var content = document.createElement('div');
        content.className = 'bot-content';

        var trace = document.createElement('div');
        trace.className = 'tool-trace';
        trace.setAttribute('aria-live', 'polite');
        trace.hidden = true;
        content.appendChild(trace);

        var div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.textContent = '…';
        content.appendChild(div);
        row.appendChild(logo);
        row.appendChild(content);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;

        fetch('/api/chat/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: sourceMessage }),
        })
          .then(function (response) {
            if (response.status === 429) return Promise.reject(new Error('rate_limited'));
            if (!response.ok) return response.json().then(function (data) {
              return Promise.reject(new Error(data.error || 'request_failed'));
            });
            return response.json();
          })
          .then(function (data) {
            var toolCalls = data.toolCalls || [];
            if (toolCalls.length) {
              trace.hidden = false;
              toolCalls.forEach(function (call) {
                var step = document.createElement('div');
                step.className = 'tool-step is-done';
                var label = TOOL_LABELS[call.name] || call.name;
                if (call.name === 'get_time' && call.result && call.result.time) {
                  label = 'get_time → ' + call.result.time;
                }
                step.innerHTML = '<span class="tool-dot"></span><span class="tool-label">' + label + '</span>';
                trace.appendChild(step);
              });
              messages.scrollTop = messages.scrollHeight;
            }

            var answer = data.reply || "I don't have a response for that.";
            typewriteText(div, answer, function () {
              content.appendChild(makeMeta(answer, formatTime(new Date()), false, null));
              refreshRetry();
              showFollowup();
              messages.scrollTop = messages.scrollHeight;
              onBotDone();
            });
          })
          .catch(function (error) {
            var message = requestFailedMessage(error);
            typewriteText(div, message, function () {
              content.appendChild(makeMeta(message, formatTime(new Date()), false, null));
              refreshRetry();
              messages.scrollTop = messages.scrollHeight;
              onBotDone();
            });
          });
      }

      function handleUserMessage(value) {
        if (isResponding) {
          enqueueMessage(value);
          input.value = '';
          autosizeInput();
          return;
        }
        isResponding = true;
        addBubble(value, 'user');
        input.value = '';
        autosizeInput();
        scrollPageBottom(false);
        updateScrollBtn();
        hideFollowup();
        sendBotReply(value);
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var value = input.value.trim();
        if (!value) return;
        handleUserMessage(value);
      });
    })();
  </script>
</body>
</html>
